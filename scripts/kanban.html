<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Kanban</title>
<style>
  :root {
    --bg-popover:       #1c1c20;
    --bg-popover-lift:  #232328;
    /* One step darker than --bg-popover — used by the project sidebar
     * (left rail) and the tasks drawer (right rail) to set them apart
     * from the main kanban canvas without a hard border. Previously
     * referenced from drawer styles without a definition; that left
     * the drawer transparent. Defining it here fixes that latent bug
     * and gives the new sidebar a matching deep-surface tone. */
    --bg-popover-deep:  #16161a;
    --hairline:         rgba(255,255,255,0.06);
    --hairline-strong:  rgba(255,255,255,0.10);
    --border-card:      rgba(255,255,255,0.04);
    --card-bg:          rgba(255,255,255,0.025);
    --text-1:           rgba(255,255,255,0.92);
    --text-2:           rgba(255,255,255,0.55);
    --text-3:           rgba(255,255,255,0.36);
    --text-4:           rgba(255,255,255,0.22);
    --red:              #f06f6f;
    --amber:            #e0b34a;
    --green:            #4fc78a;
    --teal:             #5dd0cf;
    --blue:             #6aa6f8;
    --mono:             "SF Mono", ui-monospace, Menlo, monospace;
    --sans:             -apple-system, "SF Pro Text", "SF Pro Display", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
  }
  body {
    font-family: var(--sans);
    font-size: 13px;
    background: var(--bg-popover);
    color: var(--text-1);
    /* Smoother text — matches native AppKit antialiasing better. */
    -webkit-font-smoothing: antialiased;
  }
  /* ===========================================================
   * Tasks drawer — collapsible right-side panel showing tasks
   * across sessions, grouped by their cwd-derived project.
   * Available in kanban mode only (list mode is too narrow).
   * State persists per-WebView via localStorage.
   * =========================================================== */
  body {
    /* Body becomes a 3-track grid so the left project sidebar and
     * the right tasks drawer can each take real space; the kanban
     * shrinks proportionally. Sidebar is a fixed 200px (Idea 2.α
     * from the canonical mockup). Drawer toggles 0fr ↔ 280px.
     * List mode collapses to a single track — see override below. */
    display: grid;
    grid-template-columns: 200px 1fr 0fr;
    transition: grid-template-columns 160ms ease;
  }
  body.drawer-open { grid-template-columns: 200px 1fr 280px; }
  /* List mode hides BOTH the sidebar and the drawer — the popover
   * is too narrow (~360px) to host either. The Tasks toggle pill
   * lives in the native top bar and is also hidden by Python in
   * list mode (see floating.py:_update_tasks_btn_count). */
  body.mode-list { grid-template-columns: 1fr !important; }
  body.mode-list #drawer { display: none; }
  body.mode-list #sidebar { display: none; }

  #drawer {
    background: var(--bg-popover-deep);
    border-left: 1px solid var(--hairline);
    overflow-y: auto;
    overflow-x: hidden;
    min-width: 0;
  }
  #drawer::-webkit-scrollbar { width: 6px; }
  #drawer::-webkit-scrollbar-track { background: transparent; }
  #drawer::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.10); border-radius: 3px; }

  /* The drawer toggle used to live here as a floating HTML button
   * (#drawer-toggle). It moved into the native AppKit top bar
   * alongside "Show older" — see floating.py:_load_view_safely
   * (tasks_btn). The CSS rules + DOM node were removed so the
   * top-right corner is no longer crowded by two competing toggle
   * surfaces. JS toggleDrawer() still drives the body class +
   * localStorage + bridge message; the native pill simply calls
   * window.toggleDrawer() via evaluateJavaScript. */

  .drawer-head {
    padding: 10px 12px;
    border-bottom: 1px solid var(--hairline);
    font-family: var(--mono); font-size: 9px;
    letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--text-3);
    display: flex; justify-content: space-between; align-items: baseline;
    background: var(--bg-popover-deep);
    position: sticky; top: 0; z-index: 2;
  }
  .drawer-head .total { color: var(--text-4); }

  .drawer-group { border-bottom: 1px solid var(--hairline); }
  .drawer-group-header {
    padding: 8px 12px 4px;
    display: flex; align-items: center; gap: 6px;
    font-family: var(--mono); font-size: 9.5px;
    letter-spacing: 0.06em; text-transform: uppercase;
    font-weight: 600;
  }
  .drawer-group-header .pdot {
    width: 7px; height: 7px; border-radius: 50%;
  }
  .drawer-group-header .pdot.purple { background: #b790ee; }
  .drawer-group-header .pdot.teal   { background: #5dd0cf; }
  .drawer-group-header .pdot.orange { background: #f5a85f; }
  .drawer-group-header .pdot.yellow { background: #e8c46c; }
  .drawer-group-header .pdot.mint   { background: #7dc4a9; }
  .drawer-group-header .pdot.pink   { background: #d989b8; }
  .drawer-group-header .name {
    color: var(--text-2); flex: 1; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .drawer-group-header .ct { color: var(--text-4); }

  .drawer-task {
    /* position:relative anchors the absolute-positioned .tdelete
     * × button to the row's right edge without disturbing the
     * existing grid that the text + glyph use. */
    position: relative;
    padding: 4px 12px 6px 28px;
    font-size: 11px;
    line-height: 1.45;
    cursor: pointer;
    border-left: 2px solid transparent;
  }
  .drawer-task:hover {
    background: rgba(255,255,255,0.03);
    border-left-color: var(--hairline-strong);
  }
  /* Reorderable rows get the grab/grabbing cursor so the user knows
   * they can be dragged. Inner interactive children (glyph + ↗
   * session subline + the [copy][start][delete] controls) override
   * back to a functional cursor — without this, the OS-level
   * draggable cursor shadows them and the affordance reads as
   * unclickable. */
  .drawer-task.reorderable { cursor: grab; }
  .drawer-task.reorderable:active { cursor: grabbing; }
  .drawer-task.reorderable .glyph,
  .drawer-task.reorderable .sess,
  .drawer-task.reorderable .drawer-ctrls .ctrl { cursor: pointer; }
  /* While being dragged: fade the source row to ~35% so the user
   * can see the row beneath the insertion line clearly. */
  .drawer-task.dragging { opacity: 0.35; }
  /* Drop-target hints — a 2-px colored line on the top or bottom
   * edge of the hovered target row tells the user where the
   * dragged task will land. Matches the per-card affordance. */
  .drawer-task.drag-over-before { box-shadow: inset 0 2px 0 0 var(--blue); }
  .drawer-task.drag-over-after  { box-shadow: inset 0 -2px 0 0 var(--blue); }
  /* Same-session restriction: cross-session targets get a muted
   * red insertion line so the user knows the drop will be rejected.
   * The taskReorder bridge action is per-session; cross-session
   * moves should use the ↗ session reattach affordance instead. */
  .drawer-task.drag-reject { box-shadow: inset 0 0 0 1px rgba(240,111,111,0.30); }

  /* Trailing controls for drawer tasks: [📋 copy][▶ start][× delete].
   * Hidden at rest, fade in on row hover. Live in the row grid as
   * a 3rd column so they sit inline with the text instead of
   * stacking absolutely on top of each other (which the previous
   * absolute-positioned standalone .tdelete did before the row
   * gained copy + start siblings). */
  .drawer-task .drawer-ctrls {
    display: inline-flex;
    align-items: center;
    gap: 2px;
    flex-shrink: 0;
    opacity: 0;
    transition: opacity 80ms ease;
  }
  .drawer-task:hover .drawer-ctrls { opacity: 1; }
  .drawer-task .drawer-ctrls .ctrl {
    color: var(--text-4);
    font-size: 11px;
    line-height: 1;
    padding: 3px 5px;
    cursor: pointer;
    border-radius: 3px;
    user-select: none;
    transition: color 80ms ease, background 80ms ease;
  }
  .drawer-task .drawer-ctrls .ctrl:hover {
    color: var(--text-1);
    background: rgba(255,255,255,0.06);
  }
  .drawer-task .drawer-ctrls .ctrl.tcopy:hover  { color: var(--blue); }
  .drawer-task .drawer-ctrls .ctrl.tstart:hover { color: var(--green); }
  .drawer-task .drawer-ctrls .ctrl.tdelete:hover {
    color: var(--red);
    background: rgba(240,111,111,0.10);
  }
  /* Emoji icons need a slightly larger glyph size so they look in
   * proportion with the text glyph (○/●) sitting next to them. */
  .drawer-task .drawer-ctrls .ctrl.tcopy,
  .drawer-task .drawer-ctrls .ctrl.tstart { font-size: 10px; }
  /* The × glyph is taller than the emoji icons; bump it so all
   * three read as the same visual weight. */
  .drawer-task .drawer-ctrls .ctrl.tdelete { font-size: 13px; padding-top: 1px; }

  /* Three-column grid so the controls take the trailing column
   * without forcing a wrap on the .text in the middle. */
  .drawer-task .row {
    display: grid;
    grid-template-columns: 12px 1fr auto;
    column-gap: 6px;
    align-items: center;
  }
  .drawer-task .glyph {
    font-family: var(--mono); font-size: 11px;
    color: var(--text-3); text-align: center;
  }
  .drawer-task.open.purple .glyph { color: #b790ee; }
  .drawer-task.open.teal   .glyph { color: #5dd0cf; }
  .drawer-task.open.orange .glyph { color: #f5a85f; }
  .drawer-task.open.yellow .glyph { color: #e8c46c; }
  .drawer-task.open.mint   .glyph { color: #7dc4a9; }
  .drawer-task.open.pink   .glyph { color: #d989b8; }
  .drawer-task.done .glyph,
  .drawer-task.done .text { color: var(--text-4); }
  /* User-authored rows get a clickable glyph that toggles open/done
   * (mirrors the per-card .tglyph). Pointer + hover lift make the
   * affordance discoverable; suggestions omit the class and stay
   * read-only until approved. */
  .drawer-task .glyph.clickable { cursor: pointer; }
  .drawer-task .glyph.clickable:hover { color: var(--text-1); }
  .drawer-task .text {
    color: var(--text-1);
    overflow: hidden;
    word-wrap: break-word;
  }
  .drawer-task .sess {
    color: var(--text-4);
    font-family: var(--mono);
    font-size: 9.5px;
    margin-top: 2px;
    padding-left: 18px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .drawer-empty {
    padding: 24px 16px;
    color: var(--text-3);
    font-size: 11px;
    text-align: center;
    line-height: 1.5;
  }

  /* Unattached-task sub-line: "(unattached) ↗ attach". The
   * "(unattached)" tag is muted/italic to read as state-not-action;
   * "↗ attach" lights up on hover to invite the user to attach. */
  .drawer-task .sess.unattached { color: var(--text-4); }
  .drawer-task .sess.unattached .unattached-tag {
    font-style: italic;
    color: var(--text-4);
    margin-right: 4px;
  }
  .drawer-task .sess.unattached .attach-cta {
    color: var(--blue);
    opacity: 0.75;
    transition: opacity 80ms ease;
  }
  .drawer-task .sess.unattached:hover .attach-cta { opacity: 1; }
  /* Unattached task rows get a subtle dashed left border so the user
   * can see at a glance which rows still need a session. */
  .drawer-task.unattached {
    border-left-style: dashed;
    border-left-color: rgba(106,166,248,0.30);
  }
  .drawer-task.unattached:hover { border-left-color: var(--blue); }

  /* ---- Add-task affordance + form within each drawer group ---- */
  .drawer-add-link {
    padding: 4px 12px 8px 28px;
    font-family: var(--sans);
    font-size: 10.5px;
    color: var(--text-4);
    cursor: pointer;
    user-select: none;
  }
  .drawer-add-link:hover { color: var(--text-2); }

  /* "▸ ● N done" / "▾ hide N done" collapse pill inside each
   * drawer group. Same visual language as the per-card .done-toggle
   * but adapted to the drawer's typography + left-indent. Sits
   * between the open task rows and the "+ add task" link, so the
   * eye flows: open → toggle → (done rows if revealed) → add. */
  .drawer-done-toggle {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 4px 12px 4px 28px;
    font-family: var(--mono);
    font-size: 9.5px;
    color: var(--text-4);
    cursor: pointer;
    user-select: none;
    line-height: 1.3;
  }
  .drawer-done-toggle:hover { color: var(--text-2); }
  .drawer-done-toggle .chev { width: 8px; display: inline-block; }
  .drawer-done-toggle .dot { color: var(--green, #4fc78a); font-size: 10px; }
  .drawer-done-toggle.revealed {
    color: var(--text-3);
    padding-bottom: 2px;
  }

  .drawer-add-form {
    padding: 6px 10px 10px 28px;
    background: rgba(255,255,255,0.02);
    border-top: 1px dashed rgba(255,255,255,0.06);
    border-bottom: 1px dashed rgba(255,255,255,0.06);
  }
  .drawer-add-form input {
    width: 100%;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.10);
    border-radius: 3px;
    color: var(--text-1);
    padding: 4px 7px;
    font-family: var(--sans);
    font-size: 11px;
    outline: none;
  }
  .drawer-add-form input:focus {
    border-color: rgba(106,166,248,0.40);
    background: rgba(106,166,248,0.06);
  }
  .drawer-add-form .session-pick {
    margin-top: 5px;
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-3);
  }
  .drawer-add-form .session-pick .pick-chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 1px 6px;
    border-radius: 2px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    cursor: pointer;
    color: var(--text-2);
  }
  .drawer-add-form .session-pick .pick-chip:hover {
    border-color: rgba(255,255,255,0.18);
    color: var(--text-1);
  }
  .drawer-add-form .session-pick .pick-chip .caret {
    font-size: 8px;
    color: var(--text-4);
  }
  .drawer-add-form .hint {
    margin-top: 5px;
    font-family: var(--mono);
    font-size: 9px;
    color: var(--text-4);
    letter-spacing: 0.04em;
  }
  /* "↗ attach" callout inside the add-form hint. Subtly tinted so
   * the user catches the next step at a glance without it
   * competing with the actual Enter/Esc instructions. */
  .drawer-add-form .hint .hint-cta { color: var(--blue); opacity: 0.7; }

  /* ---- Session-picker popover (used by add form + reattach) ---- */
  .session-picker-popover {
    position: absolute;
    z-index: 200;
    background: var(--bg-popover);
    border: 1px solid rgba(255,255,255,0.10);
    border-radius: 6px;
    box-shadow: 0 12px 28px rgba(0,0,0,0.45);
    padding: 4px 0;
    min-width: 220px;
    max-width: 280px;
    font-family: var(--sans);
  }
  .session-picker-head {
    padding: 6px 10px 4px;
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-4);
    border-bottom: 1px solid var(--hairline);
    margin-bottom: 4px;
  }
  .session-picker-item {
    padding: 5px 10px;
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    font-size: 11.5px;
  }
  .session-picker-item:hover {
    background: rgba(255,255,255,0.05);
  }
  .session-picker-item.current {
    background: rgba(106,166,248,0.08);
  }
  .session-picker-item .sdot {
    font-size: 11px; line-height: 1;
    flex-shrink: 0;
  }
  .session-picker-item.bucket-working .sdot { color: var(--amber); }
  .session-picker-item.bucket-needs   .sdot { color: var(--red); }
  .session-picker-item.bucket-ready   .sdot { color: var(--green); }
  .session-picker-item.bucket-dormant .sdot { color: var(--text-3); }
  .session-picker-item .stitle {
    color: var(--text-1);
    flex: 1; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .session-picker-item .sphase {
    font-family: var(--mono);
    font-size: 9.5px;
    color: var(--text-4);
  }
  .session-picker-item .current-tag {
    font-family: var(--mono);
    font-size: 9px;
    color: var(--blue);
    letter-spacing: 0.04em;
    margin-left: 6px;
  }
  .session-picker-empty {
    padding: 10px 12px;
    font-size: 11px;
    color: var(--text-3);
    text-align: center;
    font-style: italic;
  }

  /* The session label inside a drawer task — click target for reattach */
  .drawer-task .sess {
    cursor: pointer;
  }
  .drawer-task .sess:hover {
    color: var(--text-2);
  }

  /* ===========================================================
   * Layout — KANBAN mode (3 or 4 columns side by side)
   * =========================================================== */
  body.mode-kanban #app {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    height: 100vh;
    background: var(--bg-popover);
  }
  body.mode-kanban #app.with-dormant {
    grid-template-columns: 1fr 1fr 1fr 1fr;
  }
  body.mode-kanban .col {
    /* Linear's layered surface — column body sits 3-4% brighter than
     * the popover bg, so the eye reads the columns as distinct panes
     * floating on the popover floor. */
    background: var(--bg-popover-lift);
    border-right: 1px solid var(--hairline);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    min-width: 0;
  }
  body.mode-kanban .col:last-child { border-right: 0; }

  /* ===========================================================
   * Layout — LIST mode (vertical stack of sections, one card-wide)
   * Reuses the same .col / .col-header / .col-body / .card markup
   * as kanban — just changes how they're laid out.
   * =========================================================== */
  body.mode-list #app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    /* The popover is narrow in list mode (~360px) — one scrollable
     * container holds the whole stack so the user scrolls once, not
     * per-section. */
    overflow-y: auto;
    overflow-x: hidden;
    background: var(--bg-popover);
    scrollbar-width: thin;
  }
  body.mode-list #app::-webkit-scrollbar { width: 6px; }
  body.mode-list #app::-webkit-scrollbar-track { background: transparent; }
  body.mode-list #app::-webkit-scrollbar-thumb {
    background: rgba(255,255,255,0.10);
    border-radius: 3px;
  }
  body.mode-list #app::-webkit-scrollbar-thumb:hover {
    background: rgba(255,255,255,0.18);
  }
  body.mode-list .col {
    background: transparent;
    border-bottom: 1px solid var(--hairline);
    /* Sections flow vertically; no fixed height. */
    display: block;
    flex: 0 0 auto;
  }
  body.mode-list .col:last-child { border-bottom: 0; }
  /* In list mode the section header doesn't need to stick — the
   * outer scroll container handles all scrolling. Make it visually
   * more prominent than the column-header variant since it's the
   * only thing organizing the cards in a 1-up layout. */
  body.mode-list .col-header {
    background: var(--bg-popover);
    padding: 14px 14px 8px;
  }
  body.mode-list .col-header .label {
    font-size: 11px;
  }
  body.mode-list .col-body {
    overflow: visible;
    padding: 4px 12px 12px;
  }
  /* List-mode cards: slightly more breathing room since they're
   * wider and there's no horizontal column boundary doing the
   * spacing for us. */
  body.mode-list .card { margin-bottom: 8px; }

  .col {
    min-width: 0;
  }

  .col-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 12px 14px 10px;
    border-bottom: 1px solid var(--hairline);
    /* Sticky-style: the header is OUTSIDE the scrollable area so
     * cards scroll under it. */
    flex: 0 0 auto;
    background: var(--bg-popover-lift);
  }
  .col-header .label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-3);
  }
  .col-header .count {
    font-size: 11px;
    color: var(--text-4);
    font-variant-numeric: tabular-nums;
    font-family: var(--mono);
  }

  .col-body {
    flex: 1 1 auto;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 8px 10px 12px;
    /* Hide the default macOS scroller until the user is interacting —
     * matches the overlay scroller behavior of native NSScrollView. */
    scrollbar-width: thin;
  }
  .col-body::-webkit-scrollbar { width: 6px; }
  .col-body::-webkit-scrollbar-track { background: transparent; }
  .col-body::-webkit-scrollbar-thumb {
    background: rgba(255,255,255,0.10);
    border-radius: 3px;
  }
  .col-body::-webkit-scrollbar-thumb:hover {
    background: rgba(255,255,255,0.18);
  }

  .empty {
    color: var(--text-4);
    font-size: 11px;
    padding: 8px 4px;
    text-align: center;
    font-style: italic;
  }

  /* ---- Card ---- */
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border-card);
    border-radius: 5px;
    padding: 8px 10px;
    margin-bottom: 6px;
    position: relative;
    cursor: pointer;
    /* The whole card is the click target for "resume in terminal".
     * Small affordance on hover so the user knows it's clickable. */
    transition: background 80ms ease, border-color 80ms ease;
  }
  .card:hover {
    background: rgba(255,255,255,0.045);
    border-color: var(--hairline-strong);
  }
  .card:active {
    background: rgba(255,255,255,0.06);
  }

  .card .title-row {
    display: flex;
    align-items: baseline;
    gap: 7px;
  }
  .card .dot {
    flex-shrink: 0;
    font-size: 12px;
    width: 12px;
    line-height: 1;
    text-align: center;
    margin-top: 1px;
  }
  .card.needs   .dot { color: var(--red); }
  .card.working .dot { color: var(--amber); }
  .card.ready   .dot { color: var(--green); }
  .card.dormant .dot { color: var(--text-3); }

  .card .title {
    font-size: 13px;
    font-weight: 500;
    color: var(--text-1);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 1 1 auto;
    min-width: 0;
  }

  /* Unread indicator — small blue dot, click to mark-as-read.
   * Positioned at top-right, doesn't disturb title flow. */
  .card .unread-dot {
    position: absolute;
    top: 9px;
    right: 10px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--blue);
    cursor: pointer;
  }
  .card .unread-dot:hover {
    box-shadow: 0 0 0 3px rgba(106, 166, 248, 0.15);
  }

  .card .phase-gist {
    font-size: 11px;
    color: var(--text-2);
    margin-top: 4px;
    margin-left: 19px;
    /* Wrap the description across multiple lines instead of
     * truncating with an ellipsis — the user wants the full gist
     * visible even if it spans 2-3 lines. */
    line-height: 1.45;
    word-wrap: break-word;
    overflow-wrap: break-word;
  }
  .card .phase-gist .phase {
    /* Phase label is a small pill/chip that visually separates from
     * the gist body — gives it a clear "this is the phase tag"
     * affordance the eye picks up before the description text. */
    display: inline-block;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.06);
    color: var(--text-1);
    font-weight: 600;
    text-transform: uppercase;
    font-size: 9px;
    letter-spacing: 0.05em;
    padding: 1px 6px;
    border-radius: 3px;
    /* Slightly raised baseline so the chip aligns with the gist
     * text's cap-height instead of dropping below it. */
    vertical-align: 1px;
  }
  /* Per-bucket tint — the chip picks up the status color of the
   * column the card lives in so it reinforces the signal without
   * shouting. Background stays neutral; border + text pick up tint. */
  .card.needs   .phase-gist .phase {
    color: var(--red);
    border-color: rgba(240,111,111,0.30);
    background: rgba(240,111,111,0.10);
  }
  .card.working .phase-gist .phase {
    color: var(--amber);
    border-color: rgba(224,179,74,0.30);
    background: rgba(224,179,74,0.10);
  }
  .card.ready .phase-gist .phase {
    color: var(--green);
    border-color: rgba(79,199,138,0.30);
    background: rgba(79,199,138,0.10);
  }
  .card.dormant .phase-gist .phase {
    color: var(--text-3);
    border-color: rgba(255,255,255,0.06);
    background: rgba(255,255,255,0.04);
  }
  .card .phase-gist .dotsep {
    /* Sits between the phase chip and the gist text — quiet middot
     * so the chip + dot + gist all read as a single tagline. */
    color: var(--text-3);
    margin: 0 6px;
    font-weight: 600;
  }
  .card .phase-gist .gist {
    color: var(--text-1);
    font-weight: 400;
  }

  .card .meta {
    font-size: 10px;
    color: var(--text-3);
    margin-top: 4px;
    font-variant-numeric: tabular-nums;
    font-family: var(--mono);
    margin-left: 19px;
    display: flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
  }
  .card .meta .folder {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    max-width: 70%;
  }
  .card .meta .sep {
    color: var(--text-4);
  }
  .card .meta .age {
    flex-shrink: 0;
  }

  /* ===========================================================
   * Tasks block — user-curated per-session list.
   * Sits between phase-gist/meta and the sub-agent block.
   * Hidden entirely when the session has zero tasks (and not
   * already expanded for creation).
   * =========================================================== */
  .card .tasks {
    margin-top: 8px;
    margin-left: 19px;
    border-top: 1px solid var(--hairline);
    padding-top: 6px;
  }
  .card .tasks-label {
    font-family: var(--mono);
    font-size: 9px;
    color: var(--text-3);
    letter-spacing: 0.05em;
    text-transform: uppercase;
    margin-bottom: 5px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    /* Beefier hit-zone padding so the toggle is a reliable target
     * even on the narrow 180px kanban column. */
    padding: 2px 0;
  }
  .card .tasks-label .frac { color: var(--text-4); font-weight: normal; }
  .card .tasks-label .chev {
    color: var(--text-4);
    font-size: 8px;
    transition: transform 120ms ease;
  }
  /* Card-level expanded state: chevron rotates, card lifts a notch */
  .card.expanded { background: rgba(255,255,255,0.04); border-color: var(--hairline-strong); }
  .card.expanded .tasks-label .chev { transform: rotate(90deg); }

  .card .task-row {
    font-size: 10.5px;
    line-height: 1.55;
    color: var(--text-1);
    display: flex;
    align-items: baseline;
    gap: 6px;
    overflow: hidden;
    position: relative;
    padding-right: 4px;
  }
  .card .task-row .tglyph {
    flex-shrink: 0;
    font-family: var(--mono);
    font-size: 11px;
    width: 12px;
    text-align: center;
    cursor: pointer;
    /* Padded so the glyph is a generous tap target. */
    padding: 0 2px;
  }
  .card .task-row .ttext {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    min-width: 0;
    flex: 1 1 auto;
  }
  /* Expanded cards let task text wrap so long entries stay readable. */
  .card.expanded .task-row .ttext { white-space: normal; }

  /* User-authored, open: glyph picks up the bucket color */
  .card .task-row.open .tglyph { color: var(--text-2); }
  .card.working .task-row.open .tglyph { color: var(--amber); }
  .card.needs   .task-row.open .tglyph { color: var(--red); }
  .card.ready   .task-row.open .tglyph { color: var(--green); }
  .card .task-row.open .ttext { color: var(--text-1); }
  /* User-authored, done */
  .card .task-row.done .tglyph { color: var(--text-4); }
  .card .task-row.done .ttext  { color: var(--text-4); }
  /* AI-suggested, pending approval */
  .card .task-row.suggested .tglyph { color: var(--text-3); }
  .card .task-row.suggested .ttext  { color: var(--text-2); font-style: italic; }

  /* Drag-to-reorder states for open user-authored rows.
   * The .reorderable class signals draggability without changing
   * the cursor on inner controls (text gets text-cursor for edit,
   * glyph gets pointer for toggle). When a row is being dragged,
   * fade it; when another row hovers over a target slot, show a
   * thin colored insertion line on the top or bottom edge so the
   * user can predict where it will land. */
  .card .task-row.dragging {
    opacity: 0.35;
  }
  .card .task-row.drag-over-before {
    box-shadow: inset 0 2px 0 0 var(--blue);
  }
  .card .task-row.drag-over-after {
    box-shadow: inset 0 -2px 0 0 var(--blue);
  }
  /* Reorderable rows announce drag-ability by switching the row's
   * own cursor to grab. Inner interactive elements (the glyph + the
   * control icons + an in-edit input) override back to their
   * functional cursor so the click target stays legible. Without
   * these overrides the OS-level draggable cursor would shadow the
   * glyph and make "mark done" look unclickable. */
  .card .task-row.reorderable { cursor: grab; }
  .card .task-row.reorderable:active { cursor: grabbing; }
  .card .task-row.reorderable .tglyph,
  .card .task-row.reorderable .ctrls .ctrl { cursor: pointer; }
  .card .task-row.reorderable .ttext.editable { cursor: text; }
  /* While ANY row is being dragged in the popover, soften body-level
   * affordances that would otherwise distract (e.g., title hover
   * underline on .ttext.editable). */
  body.dragging-task .task-row .ttext.editable {
    border-bottom-color: transparent !important;
  }

  /* Floating tooltip shown on hover over truncated task text.
   * Single element appended to body, positioned in fixed coords near
   * the cursor by JS. pointer-events: none so it never intercepts
   * the next hover. Styled to match the popover's Linear dark
   * theme — slight lift via shadow, hairline border, dark bg. */
  .task-tooltip {
    position: fixed;
    background: var(--bg-popover);
    border: 1px solid var(--hairline-strong);
    border-radius: 4px;
    padding: 6px 9px;
    font-family: var(--sans);
    font-size: 11.5px;
    line-height: 1.4;
    color: var(--text-1);
    max-width: 340px;
    z-index: 9999;
    pointer-events: none;
    box-shadow: 0 6px 16px rgba(0,0,0,0.45);
    word-wrap: break-word;
    overflow-wrap: break-word;
    /* Hidden until JS sets display:block + position. */
    display: none;
    /* Soft fade-in once visible. */
    opacity: 0;
    transition: opacity 80ms ease;
  }
  .task-tooltip.visible { opacity: 1; }

  /* Editable task text — hover hint that the row is clickable for
   * editing. Subtle: just a barely-perceptible underline so the
   * static look isn't noisy. */
  .card .task-row .ttext.editable {
    cursor: text;
    border-bottom: 1px dotted transparent;
    transition: border-color 120ms ease;
  }
  .card .task-row .ttext.editable:hover {
    border-bottom-color: rgba(255,255,255,0.15);
  }

  /* Inline edit input — replaces .ttext when the row enters edit
   * mode. Sized to fill the row width minus the glyph; styled to
   * blend with the surrounding row, with a focus state matching the
   * + add-task input for consistency. */
  .card .task-row .ttext-edit {
    flex: 1 1 auto;
    min-width: 0;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.10);
    border-radius: 3px;
    color: var(--text-1);
    padding: 1px 5px;
    font-family: var(--sans);
    font-size: 10.5px;
    line-height: 1.4;
    outline: none;
  }
  .card .task-row .ttext-edit:focus {
    border-color: rgba(106,166,248,0.40);
    background: rgba(106,166,248,0.06);
  }
  /* Suppress hover affordances on a row that's currently editing —
   * the row IS the edit affordance. */
  .card .task-row.editing { background: transparent; }
  .card .task-row.editing .tdelete,
  .card .task-row.editing .ctrls { display: none; }

  /* Hover-revealed delete affordance */
  .card .task-row .tdelete {
    margin-left: auto;
    color: var(--text-4);
    cursor: pointer;
    opacity: 0;
    font-size: 12px;
    line-height: 1;
    padding: 0 4px;
    transition: opacity 120ms ease, color 120ms ease;
  }
  .card .task-row:hover .tdelete { opacity: 1; }
  .card .task-row .tdelete:hover { color: var(--red); }

  /* Approve / reject controls on suggested rows */
  .card .task-row .ctrls {
    margin-left: auto;
    display: flex;
    gap: 3px;
    flex-shrink: 0;
  }
  .card .task-row .ctrl {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 16px; height: 16px;
    border-radius: 3px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    font-size: 10px;
    cursor: pointer;
    line-height: 1;
  }
  .card .task-row .ctrl.approve { color: var(--green); }
  .card .task-row .ctrl.reject  { color: var(--red); }
  .card .task-row .ctrl:hover { background: rgba(255,255,255,0.10); }

  /* User-task controls ([copy][start][delete]) — same layout as the
   * suggestion ctrls but hover-revealed so the row reads as calm at
   * rest. The legacy ".tdelete" rule above no longer matches (since
   * the × is now wrapped in .ctrls.user > .ctrl.tdelete); these
   * rules take over. Tinted per-action on hover so the user can
   * tell copy/start/delete apart at a glance. */
  .card .task-row .ctrls.user {
    border: none;
    background: transparent;
    opacity: 0;
    transition: opacity 120ms ease;
  }
  .card .task-row:hover .ctrls.user { opacity: 1; }
  .card .task-row .ctrls.user .ctrl {
    border: none;
    background: transparent;
    color: var(--text-3);
  }
  .card .task-row .ctrls.user .ctrl:hover {
    background: rgba(255,255,255,0.08);
    color: var(--text-1);
  }
  .card .task-row .ctrls.user .ctrl.tcopy:hover  { color: var(--blue); }
  .card .task-row .ctrls.user .ctrl.tstart:hover { color: var(--green); }
  .card .task-row .ctrls.user .ctrl.tdelete:hover {
    color: var(--red);
    background: rgba(240,111,111,0.10);
  }
  .card .task-row .ctrls.user .ctrl.tdelete { font-size: 13px; }

  /* "+ add task" link on collapsed kanban cards that already have
   * tasks. Hidden in list mode (the input is always visible there)
   * and on the expanded state (the input renders directly).
   *
   * Differentiated from the "+ N more" hint above it:
   *   - Sans serif (not mono) — pulls it out of the metadata family
   *   - Bumped a half-step in size (10.5 vs 9.5)
   *   - Subtle top hairline so it reads as a separate affordance
   *     section, not stacked with "+N more"
   *   - Hover lifts color two notches (text-4 → text-2) so the
   *     affordance is obviously interactive
   */
  .card .add-task-link {
    font-family: var(--sans);
    font-size: 10.5px;
    color: var(--text-3);
    margin-top: 5px;
    padding-top: 5px;
    cursor: pointer;
    /* Stretch the hit zone to the full card width so clicking
     * anywhere along the line expands — easier to hit than the
     * 8-character text. */
    display: block;
    border-top: 1px dashed rgba(255,255,255,0.05);
  }
  .card .add-task-link:hover { color: var(--text-1); }
  /* In list mode the input is always shown above this; suppress
   * any stray link rendering just in case. */
  body.mode-list .card .add-task-link { display: none; }

  /* "+N more" hint shown when the preview is truncated */
  .card .tasks .more {
    font-family: var(--mono);
    font-size: 9.5px;
    color: var(--text-4);
    margin-top: 4px;
    cursor: pointer;
  }
  .card .tasks .more:hover { color: var(--text-3); }

  /* "▸ ● N done" collapse pill — folds completed tasks behind one
   * line on an expanded card. Click to reveal the rows; click again
   * to re-collapse. Sits below the open + suggested rows so the
   * eye flows top-down: in-flight work first, completed work last. */
  .card .tasks .done-toggle {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: var(--mono);
    font-size: 9.5px;
    color: var(--text-4);
    margin-top: 6px;
    padding: 2px 0;
    cursor: pointer;
    user-select: none;
    line-height: 1.3;
  }
  .card .tasks .done-toggle:hover { color: var(--text-2); }
  .card .tasks .done-toggle .chev { width: 8px; display: inline-block; }
  .card .tasks .done-toggle .dot {
    color: var(--green, #4fc78a);
    font-size: 10px;
  }
  /* Revealed (expanded) state — slightly stronger so it visibly
   * acts as a "section header" above the done rows it now leads. */
  .card .tasks .done-toggle.revealed {
    color: var(--text-3);
    margin-bottom: 2px;
  }

  /* Sub-divider above suggested tasks. */
  .card .tasks .sugg-divider {
    font-family: var(--mono);
    font-size: 8.5px;
    color: var(--text-4);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin: 8px 0 4px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .card .tasks .sugg-divider::before,
  .card .tasks .sugg-divider::after {
    content: ''; flex: 1; height: 0;
    border-top: 1px dashed rgba(255,255,255,0.08);
  }

  /* The "+ add task" input row */
  .card .add-task {
    margin-top: 6px;
    display: flex;
    gap: 6px;
    align-items: center;
    font-family: var(--mono);
    font-size: 10.5px;
  }
  .card .add-task .plus { color: var(--text-3); width: 12px; text-align: center; }
  .card .add-task input {
    flex: 1; min-width: 0;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.10);
    border-radius: 3px;
    color: var(--text-1);
    padding: 3px 6px;
    font-family: var(--sans);
    font-size: 11px;
    outline: none;
  }
  .card .add-task input::placeholder { color: var(--text-4); }
  .card .add-task input:focus {
    border-color: rgba(106,166,248,0.40);
    background: rgba(106,166,248,0.06);
  }

  /* Empty-card "+ add task" affordance — quieter than the regular
   * tasks-label so it doesn't shout on every card without tasks.
   * The "+" replaces the chevron (no fraction to show). Hover lifts
   * the color a notch to signal interactivity. */
  .card .tasks.empty-tasks { border-top: 0; padding-top: 4px; margin-top: 6px; }
  .card .tasks-label.add-affordance {
    color: var(--text-4);
    margin-bottom: 0;
  }
  .card .tasks-label.add-affordance .chev {
    transform: none !important;  /* "+" should never rotate */
    font-size: 11px;
    color: var(--text-4);
  }
  .card .tasks-label.add-affordance:hover { color: var(--text-2); }
  .card .tasks-label.add-affordance:hover .chev { color: var(--text-2); }
  /* When the card is expanded, the add-affordance is replaced by the
   * normal tasks-label (with the chevron + fraction) by the JS — so
   * the rotated-chevron rule still applies as expected. */

  /* Dormant cards used to collapse the tasks block to just the
   * fraction. The user overrode that — tasks in dormant sessions
   * stay fully visible (rows, "+ N more" expansion, "+ add task"
   * affordance) so they read like any other card. Only the title
   * dimming (declared further up) keeps dormant visually distinct. */

  /* List mode: tasks always show all rows + always-visible add input,
   * no expand/collapse — width is generous enough. */
  body.mode-list .card .tasks-label .chev { display: none; }
  body.mode-list .card .tasks-label { cursor: default; }
  body.mode-list .card .task-row .ttext { white-space: normal; }

  /* Sub-agent block — one row per running agent, then an aggregate
   * footer for completed/interrupted. Mirrors v0.3 behavior. */
  .card .subagents {
    margin-top: 6px;
    margin-left: 19px;
    border-top: 1px dashed rgba(255,255,255,0.06);
    padding-top: 6px;
  }
  .card .agent-line {
    font-family: var(--mono);
    font-size: 10px;
    line-height: 1.45;
    color: var(--text-2);
    /* Wrap the description across multiple lines when it's long
     * instead of clipping with an ellipsis. We can't keep the flex
     * row layout AND wrap text, so we drop flex and let the inline
     * children (◐ glyph, type, ·, desc) flow as normal inline text
     * — the desc continues onto a new line when it overflows, with
     * a hanging indent that lines up with the desc start. */
    word-wrap: break-word;
    overflow-wrap: break-word;
    /* Hanging indent: when the desc wraps, continuation lines sit
     * indented under the desc start (past the ◐ + type prefix)
     * instead of snapping back to the left edge. */
    padding-left: 1.4em;
    text-indent: -1.4em;
  }
  .card .agent-line .state-glyph {
    color: var(--teal);
    margin-right: 4px;
  }
  .card .agent-line .type {
    color: var(--text-3);
  }
  .card .agent-line .sep {
    color: var(--text-4);
    margin: 0 4px;
  }
  .card .agent-line .desc {
    color: var(--text-1);
  }
  .card .agent-footer {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-4);
    margin-top: 3px;
  }

  /* Dormant cards read in a single muted line — no phase, no gist,
   * no sub-agents. They're history. */
  .card.dormant .phase-gist,
  .card.dormant .subagents { display: none; }
  .card.dormant {
    opacity: 0.7;
  }
  .card.dormant .title { color: var(--text-2); font-weight: 400; }

  /* ===========================================================
   * Project sidebar — Idea 2.α from /tmp/projects-structure-d-
   * mockup.html. A 200px left rail listing All-projects, every
   * cwd-derived project, and two smart views (Needs you / Today).
   * Click an item to filter the kanban to that selection. State
   * persists in localStorage so the rail remembers the user's
   * last selection across popover open/close.
   * =========================================================== */
  #sidebar {
    background: var(--bg-popover-deep, #18181d);
    border-right: 1px solid var(--hairline);
    padding: 8px 0;
    overflow-y: auto;
    overflow-x: hidden;
    min-width: 0;
    user-select: none;
  }
  #sidebar::-webkit-scrollbar { width: 6px; }
  #sidebar::-webkit-scrollbar-track { background: transparent; }
  #sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.10); border-radius: 3px; }

  .sb-section-title {
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-4);
    padding: 10px 14px 6px;
  }
  .sb-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 14px;
    font-size: 12px;
    color: var(--text-2);
    cursor: pointer;
    border-left: 2px solid transparent;
    line-height: 1.3;
  }
  .sb-item:hover { background: rgba(255,255,255,0.03); color: var(--text-1); }
  .sb-item.on {
    background: rgba(183,144,238,0.10);
    color: var(--text-1);
    border-left-color: #b790ee;
  }
  /* Per-color tinted highlights when a colored project is selected;
   * the left-border stripe + faint background pick up that project's
   * accent so the rail visibly anchors to its dot. */
  .sb-item.on[data-color="teal"]   { background: rgba(93,208,207,0.10);  border-left-color: #5dd0cf; }
  .sb-item.on[data-color="orange"] { background: rgba(245,168,95,0.10);  border-left-color: #f5a85f; }
  .sb-item.on[data-color="yellow"] { background: rgba(232,196,108,0.10); border-left-color: #e8c46c; }
  .sb-item.on[data-color="mint"]   { background: rgba(125,196,169,0.10); border-left-color: #7dc4a9; }
  .sb-item.on[data-color="pink"]   { background: rgba(217,137,184,0.10); border-left-color: #d989b8; }
  .sb-item.on[data-color="all"]    { background: rgba(255,255,255,0.05); border-left-color: var(--text-3); }
  .sb-item.on[data-color="red"]    { background: rgba(240,111,111,0.10); border-left-color: var(--red); }
  .sb-item.on[data-color="blue"]   { background: rgba(106,166,248,0.10); border-left-color: var(--blue); }

  .sb-item .pdot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .sb-item .pdot.purple { background: #b790ee; }
  .sb-item .pdot.teal   { background: #5dd0cf; }
  .sb-item .pdot.orange { background: #f5a85f; }
  .sb-item .pdot.yellow { background: #e8c46c; }
  .sb-item .pdot.mint   { background: #7dc4a9; }
  .sb-item .pdot.pink   { background: #d989b8; }
  /* "All projects" + smart-view dots: hollow ring so they read as
   * "no specific project color" — they're virtual filters. */
  .sb-item .pdot.all {
    background: transparent;
    border: 1.5px solid var(--text-3);
    /* The border eats 1.5px on each side — bump base size to 8px to
     * compensate so the ring matches the solid 8px dots visually. */
    width: 8px;
    height: 8px;
    box-sizing: border-box;
  }
  .sb-item .label {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .sb-item .count {
    font-family: var(--mono);

    color: var(--text-4);
  }
  .sb-item.on .count { color: var(--text-2); }
  .sb-item .count.alert { color: var(--red); font-weight: 600; }
  .sb-divider { height: 1px; background: var(--hairline); margin: 8px 12px; }
  .sb-search {
    padding: 8px 12px;
    border-bottom: 1px solid var(--hairline);
    background: rgba(0,0,0,0.10);
  }
  .sb-search input {
    width: 100%;
    background: rgba(255,255,255,0.04);

  .sb-search input:focus { border-color: rgba(106,166,248,0.40); }
  /* "No matches" placeholder when project search filters out
   * everything. Kept inside the Projects section as a dim line. */

  /* ===========================================================
   * Task-start modal — pre-flight prompt editor.
   * Opened by clicking the ▶ start affordance on any user task

   * =========================================================== */
  #task-start-modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.50);
    z-index: 1000;
    display: none;             /* shown by JS as 'flex' */

  #task-start-modal.open { display: flex; }
  #task-start-modal .modal-card {
    width: min(540px, calc(100% - 48px));

  #task-start-modal .modal-head {
    font-family: var(--sans);

    color: var(--text-2);
    line-height: 1.4;

  #task-start-modal .modal-head strong {

  #task-start-modal textarea {

  #task-start-modal .btns {
    display: flex;
    justify-content: flex-end;

  #task-start-modal .btn {
    font-family: var(--sans);

  #task-start-modal .btn:hover {

  /* Session launch config (permission mode + new/existing session)

  #task-start-modal .tsm-cfg {

  #task-start-modal .tsm-seg-row {

  #task-start-modal .tsm-seg-label {

  #task-start-modal .tsm-seg {

    display: inline-flex;

  #task-start-modal .tsm-seg-btn {

  #task-start-modal .tsm-seg-btn:hover {

  #task-start-modal .tsm-seg-btn.active {

  /* Resume picker: a trigger button + dropdown menu that reuses the

  #task-start-modal .tsm-resume-wrap {

  #task-start-modal .tsm-resume-trigger {

  #task-start-modal .tsm-resume-trigger .sdot {

  #task-start-modal .tsm-resume-trigger.bucket-working .sdot { color: var(--amber); }
  #task-start-modal .tsm-resume-trigger.bucket-needs   .sdot { color: var(--red); }
  #task-start-modal .tsm-resume-trigger.bucket-ready   .sdot { color: var(--green); }
  #task-start-modal .tsm-resume-trigger.bucket-dormant .sdot { color: var(--text-3); }
  #task-start-modal .tsm-resume-trigger .tsm-resume-label {

  #task-start-modal .tsm-resume-menu {

  #task-start-modal .tsm-cmd {

    font-size: 9.5px;

  #task-start-modal .tsm-cmd b {

</style>

<body>
<aside id="sidebar"></aside>
<div id="app"></div>
<div id="drawer"></div>
<!-- #drawer-toggle moved into the native AppKit top bar (Show older
     + Tasks pill group). See floating.py:_load_view_safely. -->

<!-- Task-start modal — built once at load, populated + shown on
     demand by openTaskStartModal(). Lives at the root so it stacks
     above everything else in the popover. -->
<div id="task-start-modal" aria-hidden="true">
  <div class="modal-card" role="dialog" aria-modal="true">
    <div class="modal-head">
      Start a new Claude session in <strong id="tsm-folder">~/</strong>
    </div>
    <textarea id="tsm-prompt" placeholder="What should Claude do?"></textarea>
    <div class="hint">Edit if needed · Cmd+Enter to launch · Esc to cancel</div>
    <div class="tsm-cfg">
      <div class="tsm-seg-row">
        <span class="tsm-seg-label">Run in</span>
        <div class="tsm-seg" id="tsm-location" role="group" aria-label="Where to run">
          <button type="button" class="tsm-seg-btn" data-value="same">Same code</button>
          <button type="button" class="tsm-seg-btn" data-value="worktree">New worktree</button>
        </div>
      </div>
      <div class="tsm-seg-row" id="tsm-session-row">
        <span class="tsm-seg-label">Session</span>
        <div class="tsm-seg" id="tsm-session" role="group" aria-label="Session target">
          <button type="button" class="tsm-seg-btn" data-value="new">New session</button>
          <button type="button" class="tsm-seg-btn" data-value="existing">Existing session</button>
        </div>
      </div>
      <div class="tsm-seg-row" id="tsm-resume-row" style="display:none;">
        <span class="tsm-seg-label">Resume</span>
        <div class="tsm-resume-wrap" id="tsm-resume-wrap">
          <button type="button" class="tsm-resume-trigger" id="tsm-resume-trigger"
                  aria-haspopup="listbox" aria-expanded="false">
            <span class="sdot" id="tsm-resume-dot">○</span>
            <span class="tsm-resume-label" id="tsm-resume-label">Most recent</span>
            <span class="tsm-resume-caret">▾</span>
          </button>
          <div class="tsm-resume-menu" id="tsm-resume-menu" role="listbox" hidden></div>
        </div>
      </div>
      <div class="tsm-seg-row">
        <span class="tsm-seg-label">Permission</span>
        <div class="tsm-seg" id="tsm-perm" role="group" aria-label="Permission mode">
          <button type="button" class="tsm-seg-btn" data-value="default">Default</button>
          <button type="button" class="tsm-seg-btn" data-value="acceptEdits">Auto-accept</button>
          <button type="button" class="tsm-seg-btn" data-value="plan">Plan</button>
          <button type="button" class="tsm-seg-btn" data-value="bypass">Auto</button>
        </div>
      </div>
      <div class="tsm-cmd" id="tsm-cmd"></div>
    </div>
    <div class="btns">
      <button class="btn" id="tsm-cancel" type="button">Cancel</button>
      <button class="btn primary" id="tsm-confirm" type="button">Start ▶</button>
    </div>
  </div>
</div>

<script>
(function() {
  'use strict';

  // Column order is fixed so we always render the four buckets in the
  // same left-to-right order regardless of object-key iteration order.
  const COL_KEYS = ['needs', 'working', 'ready', 'dormant'];
  const COL_LABELS = {
    needs:   'Needs You',
    working: 'Working',
    ready:   'Finished',
    dormant: 'Dormant',
  };
  // Status glyph per bucket. Circle states map to the v0.3.0 visual
  // language (○ idle / ◐ in-progress / ● done).
  const COL_GLYPH = {
    needs:   '○',   // ○ — needs attention
    working: '◐',   // ◐ — active
    ready:   '●',   // ● — finished
    dormant: '○',   // ○ — dormant
  };

  // ---- Bridge to Python (WKScriptMessageHandler) ----
  // Sends a {action, payload} blob over the kanban message channel.
  // The Python side handles dispatch — see userContentController:didReceiveScriptMessage:.
  function send(action, payload) {
    try {
      window.webkit.messageHandlers.kanban.postMessage({
        action: action,
        payload: payload || {},
      });
    } catch (err) {
      console.error('[kanban] bridge failure', err);
    }
  }

  // ---- Per-card expansion state ----
  // The kanban refresh cycle replaces #app.innerHTML wholesale on every
  // 5s poll, so we must persist which cards are expanded outside the
  // DOM. Keyed by sessionId. List mode ignores this — its cards always
  // show everything.
  const expandedCards = new Set();

  // Sessions whose add-task input is currently open. Distinct from
  // expandedCards: list mode always shows the add-input; kanban mode
  // only shows it inside an expanded card; but we also let the user
  // explicitly open an input on a collapsed card (e.g. by hitting the
  // empty "+ add task" affordance in list mode — see wireClicks).
  const draftFocus = new Map();  // sessionId -> draft text (in-flight)

  // In-flight task edits. Keyed by taskId so the editing state can be
  // looked up regardless of which card it lives on. The Map stores
  // the draft text the user is typing; if a refresh fires mid-edit
  // we re-enter edit mode for the same row and restore the draft.
  // A null/undefined entry means "not editing" — only present keys
  // are in edit mode.
  //   editingTasks.get(taskId) === undefined  →  view mode
  //   editingTasks.get(taskId) === "..."      →  edit mode, draft text
  const editingTasks = new Map();

  // Sessions whose done-tasks block is currently REVEALED. Default
  // (sid NOT in set) = done tasks are folded behind a single
  // "▸ ● N done" pill on the card; click the pill to add the sid
  // here and expand. Click again to remove + collapse. Survives
  // refresh ticks via this in-memory Set (lives in the WKWebView's
  // JS context, same as expandedCards); resets when the panel
  // process restarts — which matches the "default to collapsed"
  // intent: stale work shouldn't keep itself open across launches.
  const doneRevealed = new Set();

  // ---- Tasks drawer state ----
  // Persisted across popover open/close via localStorage so the
  // user's preference survives the WKWebView reload (e.g. hot
  // reload of kanban.html, or app restart).
  const DRAWER_STORAGE_KEY = 'cssDrawerOpen';
  function getDrawerOpen() {
    try { return localStorage.getItem(DRAWER_STORAGE_KEY) === '1'; }
    catch (e) { return false; }
  }
  function setDrawerOpen(open) {
    try { localStorage.setItem(DRAWER_STORAGE_KEY, open ? '1' : '0'); }
    catch (e) { /* private browsing or storage denied — non-fatal */ }
    document.body.classList.toggle('drawer-open', !!open);
    // Tell Python so it can grow the popover by DRAWER_WIDTH_PX
    // (same UX pattern as the "Show older" toggle). Without this,
    // opening the drawer would just squeeze the kanban into a
    // narrower track inside the existing popover size. Python
    // de-dups identical state so this is safe to call on every
    // toggle AND on the initial mount sync from DOMContentLoaded.
    try { send('drawerToggled', { open: !!open }); }
    catch (e) { /* bridge not ready yet — Python's persisted flag
                  + the no-op guard cover the next refresh tick */ }
  }
  function toggleDrawer() {
    setDrawerOpen(!getDrawerOpen());
  }
  // Expose toggleDrawer on window so the native Tasks pill in the
  // top bar can invoke it via WKWebView.evaluateJavaScript. Without
  // this, `window.toggleDrawer` would be undefined (the IIFE keeps
  // toggleDrawer module-private).
  window.toggleDrawer = toggleDrawer;
  // Restore the body class from localStorage on initial mount. The
  // toggle BUTTON itself now lives in the native AppKit top bar
  // (floating.py:_load_view_safely > tasks_btn), so we no longer
  // attach a DOM click handler here — only sync the class +
  // Python state from the persisted JS-side flag.
  document.addEventListener('DOMContentLoaded', function() {
    setDrawerOpen(getDrawerOpen());
  }, { once: true });

  // ---- Drawer per-group state ----
  // Which group currently has its "+ add task" form open. Only one
  // form open at a time; clicking "+ add" on another group closes
  // the current one. Keyed by group cwd (a stable identifier).
  // Stored across refreshes so the form survives the 5s tick.
  let _drawerAddCwd = null;
  // Per-group draft text + chosen session id (so the form re-opens
  // with the user's in-flight content + session pick).
  const _drawerAddDrafts = new Map();  // cwd -> { content, sessionId }
  // The cached payload from the latest renderApp — used by the
  // session picker popover to enumerate sessions in a group.
  let _drawerData = null;

  // Drawer-side per-group "done revealed" state. Mirrors
  // `doneRevealed` for the per-card tasks block, but keyed by cwd
  // (the drawer's group key) instead of sessionId. Default (cwd
  // NOT in set) = done tasks are folded behind a single
  // "▸ ● N done" pill at the bottom of the group; click reveals
  // all done rows; click again re-collapses. Lives in this Set
  // for the lifetime of the WKWebView (same survival rules as
  // doneRevealed) — resets to "everything collapsed" on panel
  // restart, which matches the "completed work fades out by
  // default" intent.
  const drawerDoneRevealed = new Set();

  // ===========================================================
  // Project sidebar (Idea 2.α from the canonical mockup)
  // -----------------------------------------------------------
  // The slim left rail. State: which item is selected (All /
  // a specific project's cwd / one of two smart views). Persists
  // in localStorage so the popover re-opens to the last view.
  // ===========================================================
  const SIDEBAR_SELECTION_KEY = 'kanban.sidebar.selection.v1';
  const SIDEBAR_SEARCH_KEY    = 'kanban.sidebar.search.v1';

  function _readSidebarSelection() {
    // Selection shape: {kind: 'all'|'project'|'needsYou'|'today',
    //                   cwd: string|null}. Anything malformed -> All.
    try {
      const raw = localStorage.getItem(SIDEBAR_SELECTION_KEY);
      if (!raw) return { kind: 'all', cwd: null };
      const parsed = JSON.parse(raw);
      if (parsed && typeof parsed.kind === 'string') {
        return {
          kind: parsed.kind,
          cwd: typeof parsed.cwd === 'string' ? parsed.cwd : null,
        };
      }
    } catch (e) { /* swallow — start fresh */ }
    return { kind: 'all', cwd: null };
  }
  function _writeSidebarSelection(sel) {
    try { localStorage.setItem(SIDEBAR_SELECTION_KEY, JSON.stringify(sel)); }
    catch (e) { /* localStorage full / disabled — fine, in-memory still works */ }
  }
  function _readSidebarSearch() {
    try { return localStorage.getItem(SIDEBAR_SEARCH_KEY) || ''; }
    catch (e) { return ''; }
  }
  function _writeSidebarSearch(q) {
    try { localStorage.setItem(SIDEBAR_SEARCH_KEY, q || ''); }
    catch (e) { /* ignore */ }
  }

  let _sidebarSelection = _readSidebarSelection();
  let _sidebarSearch    = _readSidebarSearch();
  // Latest sidebar payload from Python (project list + totals).
  // Cached so a sidebar interaction can re-render without a Python
  // round-trip — we just re-filter the latest buckets locally.
  let _sidebarData = null;
  // Latest full payload object — needed so sidebar clicks can call
  // renderApp(_lastData) and re-build the kanban with a different
  // filter applied. Set on every successful renderApp.
  let _lastData = null;

  function setSidebarSelection(sel) {
    _sidebarSelection = sel || { kind: 'all', cwd: null };
    _writeSidebarSelection(_sidebarSelection);
    // Bust the payload-equality short-circuit in renderApp so the
    // re-render actually fires even though the Python payload is
    // bytes-identical to the previous one.
    _lastPayloadJson = null;
    if (_lastData) renderApp(_lastData);
  }

  function _selectionEquals(a, b) {
    if (!a || !b) return false;
    if (a.kind !== b.kind) return false;
    if (a.kind === 'project') return (a.cwd || '') === (b.cwd || '');
    return true;
  }

  // Apply the user's sidebar filter to the bucket payload. Returns
  // a NEW buckets object with the same shape so downstream column
  // code is unchanged — counts and card lists naturally reflect the
  // filter without any extra plumbing.
  function filterBuckets(buckets, sel) {
    if (!sel || sel.kind === 'all') return buckets;
    const out = {};
    const TODAY_S = 24 * 3600;
    ['needs','working','ready','dormant'].forEach(function(key) {
      const rows = buckets[key] || [];
      let kept;
      if (sel.kind === 'project') {
        const want = sel.cwd || '';
        kept = rows.filter(function(r) { return (r.cwd || '') === want; });
      } else if (sel.kind === 'needsYou') {
        // Surface only the Needs You column's contents — the other
        // status columns render empty under this smart view. The
        // user can still see "what wants me right now" without
        // mixing in working/ready noise.
        kept = (key === 'needs') ? rows.slice() : [];
      } else if (sel.kind === 'today') {
        kept = rows.filter(function(r) {
          return typeof r.ago_s === 'number' && r.ago_s < TODAY_S;
        });
      } else {
        kept = rows.slice();
      }
      out[key] = kept;
    });
    return out;
  }

  function renderSidebar(sidebar) {
    const root = document.getElementById('sidebar');
    if (!root) return;
    _sidebarData = sidebar || null;

    // If the previously selected project no longer exists (cwd
    // aged out of the visible session set), fall back to All so
    // the user doesn't get stuck on an empty filter.
    if (_sidebarSelection.kind === 'project') {
      const exists = (sidebar && sidebar.projects || []).some(function(p) {
        return (p.cwd || '') === (_sidebarSelection.cwd || '');
      });
      if (!exists) _sidebarSelection = { kind: 'all', cwd: null };
    }

    if (!sidebar) {
      // List mode (or pre-handshake) — empty out the rail; CSS
      // already hides it in list mode so this is just hygiene.
      root.innerHTML = '';
      return;
    }
    const sel = _sidebarSelection;
    const totals = sidebar.totals || { all: 0, needsYou: 0, today: 0 };
    const projects = Array.isArray(sidebar.projects) ? sidebar.projects : [];

    // Capture focus on the search input so a 5s refresh doesn't
    // yank the caret out mid-type.
    const activeEl = document.activeElement;
    const wasSearchFocused = !!(activeEl
      && activeEl.matches
      && activeEl.matches('#sidebar input[data-sb-search]'));
    let searchCaret = 0;
    if (wasSearchFocused) searchCaret = activeEl.selectionStart || 0;

    // Project search filter — case-insensitive substring match.
    const q = (_sidebarSearch || '').trim().toLowerCase();
    const matched = q
      ? projects.filter(function(p) { return (p.label || '').toLowerCase().indexOf(q) !== -1; })
      : projects;

    const allOn       = (sel.kind === 'all');
    const needsYouOn  = (sel.kind === 'needsYou');
    const todayOn     = (sel.kind === 'today');

    let html = ''
      + '<div class="sb-search">'
      +   '<input type="text" data-sb-search placeholder="Search projects…" value="' + esc(_sidebarSearch || '') + '">'
      + '</div>'
      + '<div class="sb-section-title">View</div>'
      + '<div class="sb-item' + (allOn ? ' on' : '') + '" data-sb-action="all" data-color="all">'
      +   '<span class="pdot all"></span>'
      +   '<span class="label">All projects</span>'
      +   '<span class="count">' + (totals.all || 0) + '</span>'
      + '</div>'
      + '<div class="sb-divider"></div>'
      + '<div class="sb-section-title">Projects</div>';
    if (matched.length === 0) {
      html += '<div class="sb-empty">' + (q ? 'no match' : 'no projects') + '</div>';
    } else {
      matched.forEach(function(p) {
        const isOn = (sel.kind === 'project' && (sel.cwd || '') === (p.cwd || ''));
        const color = p.color || 'purple';
        const cwdAttr = esc(p.cwd || '');
        const alertCls = (p.alertCount && p.alertCount > 0) ? ' alert' : '';
        const countVal = (p.alertCount && p.alertCount > 0)
          ? String(p.alertCount)
          : String(p.count || 0);
        html += ''
          + '<div class="sb-item' + (isOn ? ' on' : '') + '"'
          +    ' data-sb-action="project"'
          +    ' data-cwd="' + cwdAttr + '"'
          +    ' data-color="' + esc(color) + '">'
          +   '<span class="pdot ' + esc(color) + '"></span>'
          +   '<span class="label" title="' + esc(p.label || '') + '">' + esc(p.label || '') + '</span>'
          +   '<span class="count' + alertCls + '">' + countVal + '</span>'
          + '</div>';
      });
    }
    html += ''
      + '<div class="sb-divider"></div>'
      + '<div class="sb-section-title">Smart views</div>'
      + '<div class="sb-item' + (needsYouOn ? ' on' : '') + '" data-sb-action="needsYou" data-color="red">'
      +   '<span class="pdot all"></span>'
      +   '<span class="label">Needs you</span>'
      +   '<span class="count' + ((totals.needsYou || 0) > 0 ? ' alert' : '') + '">' + (totals.needsYou || 0) + '</span>'
      + '</div>'
      + '<div class="sb-item' + (todayOn ? ' on' : '') + '" data-sb-action="today" data-color="blue">'
      +   '<span class="pdot all"></span>'
      +   '<span class="label">Today</span>'
      +   '<span class="count">' + (totals.today || 0) + '</span>'
      + '</div>';
    root.innerHTML = html;
    wireSidebarClicks(root);

    // Restore search focus + caret if the user was typing.
    if (wasSearchFocused) {
      const inp = root.querySelector('input[data-sb-search]');
      if (inp) {
        inp.focus();
        try { inp.setSelectionRange(searchCaret, searchCaret); }
        catch (e) { /* ignore */ }
      }
    }
  }

  function wireSidebarClicks(root) {
    // Item click → switch selection. The data-sb-action attribute
    // distinguishes all / project / needsYou / today.
    root.querySelectorAll('[data-sb-action]').forEach(function(el) {
      el.addEventListener('click', function(ev) {
        const action = el.getAttribute('data-sb-action');
        let next;
        if (action === 'project') {
          next = { kind: 'project', cwd: el.getAttribute('data-cwd') || '' };
        } else if (action === 'needsYou') {
          next = { kind: 'needsYou', cwd: null };
        } else if (action === 'today') {
          next = { kind: 'today', cwd: null };
        } else {
          next = { kind: 'all', cwd: null };
        }
        // Click the active item again → reset to All (familiar
        // affordance: clicking a selected filter clears it).
        if (_selectionEquals(next, _sidebarSelection)) {
          next = { kind: 'all', cwd: null };
        }
        setSidebarSelection(next);
      });
    });
    // Search input — filter the visible project list as the user
    // types. Cheap (in-memory filter, no Python round-trip).
    const searchEl = root.querySelector('input[data-sb-search]');
    if (searchEl) {
      searchEl.addEventListener('input', function() {
        _sidebarSearch = searchEl.value || '';
        _writeSidebarSearch(_sidebarSearch);
        // Re-render just the sidebar (cheap) — no need to rebuild
        // the kanban since search is sidebar-local.
        renderSidebar(_sidebarData);
      });
      // Escape clears the search.
      searchEl.addEventListener('keydown', function(ev) {
        if (ev.key === 'Escape') {
          ev.preventDefault();
          _sidebarSearch = '';
          _writeSidebarSearch('');
          renderSidebar(_sidebarData);
        }
      });
    }
  }

  function renderDrawer(drawer, visibleSids) {
    const root = document.getElementById('drawer');
    if (!root) return;
    // The drawer count badge used to live inside the floating
    // #drawer-toggle button; that toggle moved into the native
    // top bar and Python computes its own count via the drawer
    // payload (see floating.py:_update_tasks_btn_count). The
    // local `countEl` lookups below are no-ops on a null ref —
    // kept as null so the legacy code paths don't crash if/when
    // someone re-introduces an in-doc count node later.
    const countEl = null;

    // Mirror the kanban's sidebar filter inside the drawer. When the
    // user picks a project / Needs you / Today in the left rail, the
    // drawer narrows to tasks from the same set of sessions. Done by
    // dropping any task whose sessionId isn't in `visibleSids`, then
    // dropping groups that empty out. `visibleSids === null` means
    // the sidebar is on All-projects (no filter) — leave drawer as-is.
    //
    // Unattached tasks (sessionId == __unattached__:<cwd>) are NEVER
    // in visibleSids — they don't live in `buckets`. Apply selection-
    // specific rules to them directly:
    //   • project   — keep when the row's groupCwd == sel.cwd. Picking
    //                 a project should NEVER hide its parked todos.
    //   • needsYou  — drop. Unattached rows can't "need" anything by
    //                 session-bucket definition; surfacing them under
    //                 "Needs you" would dilute the alert.
    //   • today     — keep. The user just authored these recently;
    //                 surfacing them under "Today" matches intent.
    //
    // The cache (`_drawerData`) keeps the UNFILTERED copy so the
    // session pickers (create + reattach forms) always show every
    // session in a project, even ones filtered out of the current
    // view.
    _drawerData = drawer || null;
    if (drawer && visibleSids instanceof Set) {
      const sel = _sidebarSelection || { kind: 'all', cwd: null };
      const keepUnattached = function(_t, groupCwd) {
        if (sel.kind === 'project') {
          return (groupCwd || '') === (sel.cwd || '');
        }
        if (sel.kind === 'today')    return true;
        if (sel.kind === 'needsYou') return false;
        return true;  // fallback (shouldn't reach — sel.kind=='all' bypasses this branch)
      };
      const filteredGroups = [];
      (drawer.groups || []).forEach(function(g) {
        const tasks = (g.tasks || []).filter(function(t) {
          if (t.unattached) return keepUnattached(t, g.cwd);
          return visibleSids.has(t.sessionId);
        });
        if (tasks.length > 0) {
          filteredGroups.push(Object.assign({}, g, { tasks: tasks }));
        }
      });
      drawer = { groups: filteredGroups };
    }
    // Capture which input was focused so a 5s refresh doesn't yank
    // focus out of the user's typing inside the drawer.
    const activeEl = document.activeElement;
    let focusCwd = null, focusCaret = 0;
    if (activeEl && typeof activeEl.matches === 'function'
        && activeEl.matches('input[data-drawer-add-input]')) {
      focusCwd = activeEl.getAttribute('data-cwd');
      focusCaret = activeEl.selectionStart || 0;
    }
    if (!drawer || !Array.isArray(drawer.groups) || drawer.groups.length === 0) {
      root.innerHTML =
        '<div class="drawer-head"><span>Tasks</span><span class="total">0</span></div>'
        + '<div class="drawer-empty">No tasks yet across any open session.<br><br>'
        + 'Click "+ add task" on any session card to start.</div>';
      if (countEl) countEl.textContent = '';
      return;
    }
    let total = 0, totalOpen = 0;
    drawer.groups.forEach(function(g) {
      (g.tasks || []).forEach(function(t) {
        total++;
        if (t.status === 'open') totalOpen++;
      });
    });
    if (countEl) countEl.textContent = totalOpen > 0 ? String(totalOpen) : '';

    const html = [];
    html.push(
      '<div class="drawer-head">'
      + '<span>Tasks by project</span>'
      + '<span class="total">' + totalOpen + ' open / ' + total + '</span>'
      + '</div>'
    );

    drawer.groups.forEach(function(g) {
      const color = esc(g.color || 'purple');
      const label = esc(g.label || '(unnamed)');
      const groupCwd = g.cwd || '';
      const sessions = Array.isArray(g.sessions) ? g.sessions : [];
      const tasks = Array.isArray(g.tasks) ? g.tasks : [];
      const openCount = tasks.filter(function(t) { return t.status === 'open'; }).length;
      html.push('<div class="drawer-group" data-cwd="' + esc(groupCwd) + '">');
      html.push(
        '<div class="drawer-group-header">'
        + '<span class="pdot ' + color + '"></span>'
        + '<span class="name">' + label + '</span>'
        + '<span class="ct">' + openCount + ' open</span>'
        + '</div>'
      );
      // Split tasks into open + done so we can render done behind a
      // collapsible pill at the bottom of the group. Open tasks
      // always show. Done tasks collapse by default — clicking the
      // "▸ ● N done" pill reveals them; click again re-collapses.
      // Mirrors the per-card behavior in renderTasksBlock so the
      // two surfaces feel consistent.
      const openTasks = tasks.filter(function(t) { return t.status !== 'done'; });
      const doneTasks = tasks.filter(function(t) { return t.status === 'done'; });
      const renderTaskRow = function(t) {
        const cls = (t.status === 'done' ? 'done' : 'open') + ' ' + color;
        const glyph = t.status === 'done' ? '●' : '○';
        const text = esc(t.content || '');
        const sess = esc(t.sessionTitle || '');
        const tid = esc(t.id || '');
        // Reorder + delete eligibility — mirrors the per-card rules:
        // only OPEN, USER-AUTHORED tasks (or APPROVED suggestions)
        // get the reorder/delete affordances. Done tasks can't be
        // reordered (sort-locked by completedAt) but their glyph IS
        // clickable to flip back to open — see the clickable-glyph
        // branch below and the drawer-task-toggle handler. Unapproved
        // suggestions still need the ✓/✗ flow before any mutation.
        const isUserTask = t.source !== 'suggested' || t.approved;
        const isReorderable = isUserTask && t.status === 'open';
        const isDeletable = isUserTask;
        const isUnattached = !!t.unattached;
        // Sub-line label: attached → "↗ <session title>" (click to
        // reattach). Unattached → "(unattached) ↗ attach" (same
        // picker, but the move-to operation goes pseudo → real). The
        // [data-action="reattach"] handler is shared so both flows
        // route through openSessionPicker → taskAttachSession.
        let subLine = '';
        if (isUnattached) {
          subLine = '<div class="sess unattached" data-action="reattach">'
                  + '<span class="unattached-tag">(unattached)</span>'
                  + ' <span class="attach-cta">↗ attach</span>'
                  + '</div>';
        } else if (sess) {
          subLine = '<div class="sess" data-action="reattach">↗ ' + sess + '</div>';
        }
        // draggable="false" on each interactive child keeps the
        // row's draggable="true" from making them grab-cursor
        // shadowed. Without this, clicking the controls in a
        // reorderable row can be swallowed by a drag start.
        return ''
          + '<div class="drawer-task ' + cls
            + (isReorderable ? ' reorderable' : '')
            + (isUnattached ? ' unattached' : '') + '"'
            + ' data-task-id="' + tid + '"'
            + ' data-session-id="' + esc(t.sessionId || '') + '"'
            + ' data-cwd="' + esc(groupCwd) + '"'
            + (isReorderable ? ' draggable="true"' : '')
            + '>'
          + '<div class="row">'
          +   '<span class="glyph' + (isUserTask ? ' clickable' : '') + '"'
          +     (isUserTask
                  ? ' data-action="drawer-task-toggle" data-task-id="' + tid + '"'
                    + ' title="Mark ' + (t.status === 'done' ? 'open' : 'done') + '"'
                  : '')
          +     (isReorderable ? ' draggable="false"' : '')
          +   '>' + glyph + '</span>'
          +   '<span class="text">' + text + '</span>'
          +   (isDeletable
              ? '<span class="drawer-ctrls" draggable="false">'
                + '<span class="ctrl tcopy" data-action="drawer-task-copy"'
                  + ' data-task-id="' + tid + '" title="Copy prompt" draggable="false">📋</span>'
                + '<span class="ctrl tstart" data-action="drawer-task-start"'
                  + ' data-task-id="' + tid + '" title="Start in this folder" draggable="false">▶</span>'
                + '<span class="ctrl tdelete" data-action="drawer-task-delete"'
                  + ' data-task-id="' + tid + '" title="Delete" draggable="false">×</span>'
                + '</span>'
              : '')
          + '</div>'
          + subLine
          + '</div>';
      };

      // Open tasks always render — these are the "active" rows.
      openTasks.forEach(function(t) { html.push(renderTaskRow(t)); });

      // Done tasks — collapsed by default behind a single pill.
      // Click "▸ ● N done" to reveal; click "▾ hide N done" to fold
      // back. Per-group state lives in drawerDoneRevealed (keyed
      // by cwd). When there are zero done tasks the pill is omitted
      // entirely so we don't leave a dangling "0 done" line.
      if (doneTasks.length > 0) {
        const revealed = drawerDoneRevealed.has(groupCwd);
        if (revealed) {
          html.push(
            '<div class="drawer-done-toggle revealed"'
            + ' data-action="drawer-toggle-done"'
            + ' data-cwd="' + esc(groupCwd) + '"'
            + ' title="Hide completed tasks">'
            + '<span class="chev">▾</span>'
            + '<span>hide ' + doneTasks.length + ' done</span>'
            + '</div>'
          );
          doneTasks.forEach(function(t) { html.push(renderTaskRow(t)); });
        } else {
          html.push(
            '<div class="drawer-done-toggle"'
            + ' data-action="drawer-toggle-done"'
            + ' data-cwd="' + esc(groupCwd) + '"'
            + ' title="Show completed tasks">'
            + '<span class="chev">▸</span>'
            + '<span class="dot">●</span>'
            + '<span>' + doneTasks.length + ' done</span>'
            + '</div>'
          );
        }
      }

      // Add-task affordance / form for this group. Tasks created
      // here are UNATTACHED by default — the user types content +
      // hits Enter and the task lands in the project's pseudo-
      // session bucket (__unattached__:<cwd>). They later attach
      // it to a real session by clicking "↗ attach" on the row.
      // We no longer gate on `sessions.length > 0` because the
      // drawer can host pure-unattached groups (no live sessions
      // in this cwd, but pending todos exist).
      {
        const isOpen = _drawerAddCwd === groupCwd;
        if (isOpen) {
          const draft = _drawerAddDrafts.get(groupCwd) || {};
          const draftText = esc(draft.content || '');
          html.push(
            '<div class="drawer-add-form">'
            + '<input type="text" placeholder="What needs to happen?"'
            + ' data-drawer-add-input data-cwd="' + esc(groupCwd) + '"'
            + ' value="' + draftText + '" />'
            + '<div class="hint">Enter to save · Esc to cancel'
            +   ' · attach later via <span class="hint-cta">↗ attach</span>'
            + '</div>'
            + '</div>'
          );
        } else {
          html.push(
            '<div class="drawer-add-link" data-action="drawer-add-open"'
            + ' data-cwd="' + esc(groupCwd) + '">+ add task</div>'
          );
        }
      }
      html.push('</div>');
    });
    root.innerHTML = html.join('');
    wireDrawerClicks(root);

    // Restore focus into the open add-input if it lost it across
    // the refresh (e.g., user was typing when the 5s tick fired).
    if (focusCwd) {
      const inp = root.querySelector(
        'input[data-drawer-add-input][data-cwd="' + cssEscape(focusCwd) + '"]'
      );
      if (inp) {
        inp.focus();
        try { inp.setSelectionRange(focusCaret, focusCaret); }
        catch (e) { /* ok */ }
      }
    }
  }

  // Wire every interactive element inside the drawer. Called on every
  // renderDrawer() — the drawer's contents are wholesale-replaced.
  function wireDrawerClicks(root) {
    if (!root) return;

    // Task row click → resume the host session (but NOT when the
    // click landed on the session label, which has its own handler).
    root.querySelectorAll('.drawer-task').forEach(function(el) {
      el.addEventListener('click', function(ev) {
        if (ev.target.closest('[data-action]')) return;
        const sid = el.dataset.sessionId;
        if (!sid) return;
        send('resume', { sessionId: sid, cwd: '' });
      });
    });

    // Session label (the "↗ session" sub-line) → open reattach picker.
    root.querySelectorAll('[data-action="reattach"]').forEach(function(el) {
      el.addEventListener('click', function(ev) {
        ev.stopPropagation();
        const taskEl = el.closest('.drawer-task');
