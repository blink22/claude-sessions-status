        if (!taskEl) return;
        const cwd = taskEl.dataset.cwd || '';
        const currentSid = taskEl.dataset.sessionId || '';
        const taskId = taskEl.dataset.taskId || '';
        openSessionPicker(el, cwd, currentSid, function(newSid) {
          if (!newSid || newSid === currentSid) return;
          send('taskAttachSession', {
            sessionId: currentSid,       // task's CURRENT session
            taskId: taskId,
            newSessionId: newSid,
          });
        });
      });
    });

    // "▸ ● N done" / "▾ hide N done" → toggle the group's done
    // tasks between collapsed (pill only) and revealed (pill +
    // rows). Per-group state lives in drawerDoneRevealed; the
    // re-render goes through renderDrawer with the cached
    // _drawerData so we don't need a Python round-trip.
    root.querySelectorAll('[data-action="drawer-toggle-done"]').forEach(function(el) {
      el.addEventListener('click', function(ev) {
        ev.stopPropagation();
        const cwd = el.getAttribute('data-cwd') || '';
        if (drawerDoneRevealed.has(cwd)) drawerDoneRevealed.delete(cwd);
        else drawerDoneRevealed.add(cwd);
        renderDrawer(_drawerData);
      });
    });

    // Task glyph (○/●) → flip open ↔ done, mirroring the per-card
    // glyph. Routes through the same `taskToggle` bridge action the
    // card view uses, so attached and unattached tasks both work
    // (unattached rows carry their pseudo-session id in
    // data-session-id, which toggle_task accepts). The resume-click
    // handler above short-circuits on [data-action] elements, so
    // toggling never also opens the host session. Only user-authored
    // rows expose this — suggestions stay immutable until approved,
    // the same rule the delete/start controls already follow.
    root.querySelectorAll('[data-action="drawer-task-toggle"]').forEach(function(el) {
      el.addEventListener('click', function(ev) {
        ev.stopPropagation();
        const taskEl = el.closest('.drawer-task');
        if (!taskEl) return;
        const sid = taskEl.dataset.sessionId || '';
        const tid = taskEl.dataset.taskId || '';
        if (!sid || !tid) return;
        send('taskToggle', { sessionId: sid, taskId: tid });
      });
    });

    // × delete button → drop the user-authored task from disk via
    // the same taskDelete bridge action the per-card × uses. The
    // resume-click handler above already short-circuits when the
    // event target sits inside a [data-action] element, so we
    // don't accidentally open the session on the way out.
    root.querySelectorAll('[data-action="drawer-task-delete"]').forEach(function(el) {
      el.addEventListener('click', function(ev) {
        ev.stopPropagation();
        const taskEl = el.closest('.drawer-task');
        if (!taskEl) return;
        const sid = taskEl.dataset.sessionId || '';
        const tid = taskEl.dataset.taskId || '';
        if (!sid || !tid) return;
        send('taskDelete', { sessionId: sid, taskId: tid });
      });
    });

    // 📋 copy task content → clipboard. Source-of-truth for the
    // task text is the cached _drawerData (the unfiltered Python
    // payload) so we read it from there rather than scraping the
    // DOM's already-escaped innerHTML.
    root.querySelectorAll('[data-action="drawer-task-copy"]').forEach(function(el) {
      el.addEventListener('click', function(ev) {
        ev.stopPropagation();
        const taskEl = el.closest('.drawer-task');
        if (!taskEl) return;
        const tid = taskEl.dataset.taskId || '';
        if (!tid || !_drawerData) return;
        let found = null;
        (_drawerData.groups || []).some(function(g) {
          return (g.tasks || []).some(function(t) {
            if (t.id === tid) { found = t; return true; }
            return false;
          });
        });
        if (found) copyTaskPrompt(found.content || '');
      });
    });

    // ▶ start in this folder. Group's cwd → modal → Python
    // spawns Terminal at that path running claude <prompt>.
    root.querySelectorAll('[data-action="drawer-task-start"]').forEach(function(el) {
      el.addEventListener('click', function(ev) {
        ev.stopPropagation();
        const taskEl = el.closest('.drawer-task');
        if (!taskEl) return;
        const tid = taskEl.dataset.taskId || '';
        const cwd = taskEl.dataset.cwd || '';
        if (!tid || !_drawerData) return;
        let found = null;
        (_drawerData.groups || []).some(function(g) {
          return (g.tasks || []).some(function(t) {
            if (t.id === tid) { found = t; return true; }
            return false;
          });
        });
        if (found) openTaskStartModal(found.content || '', cwd);
      });
    });

    // Drag-to-reorder. Restricted to same-session targets — the
    // backend taskReorder API rewrites positions within ONE
    // session, so cross-session drops are rejected (the user can
    // already reattach across sessions via the ↗ affordance).
    // Pattern mirrors the per-card .task-row.reorderable wiring.
    root.querySelectorAll('.drawer-task.reorderable').forEach(function(rowEl) {
      rowEl.addEventListener('dragstart', function(ev) {
        if (!ev.dataTransfer) return;
        ev.dataTransfer.effectAllowed = 'move';
        try { ev.dataTransfer.setData('text/plain', rowEl.dataset.taskId || ''); }
        catch (e) { /* some browsers throw on setData here */ }
        rowEl.classList.add('dragging');
        document.body.classList.add('dragging-task');
      });
      rowEl.addEventListener('dragend', function() {
        // Global cleanup — a 5s refresh during the drag could
        // detach the original rowEl and re-emit the .dragging
        // class on a fresh element; sweep all states defensively.
        document.querySelectorAll(
          '.drawer-task.dragging, .drawer-task.drag-over-before,'
          + ' .drawer-task.drag-over-after, .drawer-task.drag-reject'
        ).forEach(function(el) {
          el.classList.remove(
            'dragging', 'drag-over-before', 'drag-over-after', 'drag-reject');
        });
        document.body.classList.remove('dragging-task');
      });
    });

    // Drop targets — same-session reorderable rows. Cross-session
    // rows get a muted red rejection hint instead of an insertion
    // line so the user knows where the limit is.
    root.querySelectorAll('.drawer-task.reorderable').forEach(function(target) {
      target.addEventListener('dragover', function(ev) {
        const dragging = root.querySelector('.drawer-task.dragging');
        if (!dragging || dragging === target) return;
        const sameSession = (dragging.dataset.sessionId || '')
          === (target.dataset.sessionId || '');
        if (!sameSession) {
          // Disallow the drop but still preventDefault so we get
          // dragleave events to clear the rejection hint.
          ev.preventDefault();
          if (ev.dataTransfer) ev.dataTransfer.dropEffect = 'none';
          target.classList.add('drag-reject');
          target.classList.remove('drag-over-before', 'drag-over-after');
          return;
        }
        ev.preventDefault();  // allow drop
        if (ev.dataTransfer) ev.dataTransfer.dropEffect = 'move';
        const rect = target.getBoundingClientRect();
        const isBefore = (ev.clientY - rect.top) < (rect.height / 2);
        target.classList.toggle('drag-over-before', isBefore);
        target.classList.toggle('drag-over-after', !isBefore);
        target.classList.remove('drag-reject');
      });
      target.addEventListener('dragleave', function() {
        target.classList.remove(
          'drag-over-before', 'drag-over-after', 'drag-reject');
      });
      target.addEventListener('drop', function(ev) {
        const dragging = root.querySelector('.drawer-task.dragging');
        if (!dragging || dragging === target) return;
        const sid = dragging.dataset.sessionId || '';
        if (!sid || sid !== (target.dataset.sessionId || '')) {
          // Cross-session drop — silently reject. The drag-reject
          // class clears via dragend's sweep.
          target.classList.remove('drag-reject');
          return;
        }
        ev.preventDefault();
        const rect = target.getBoundingClientRect();
        const isBefore = (ev.clientY - rect.top) < (rect.height / 2);
        // Optimistic move in the DOM — the Python refresh
        // (~100ms later) confirms the order from disk.
        if (isBefore) {
          target.parentNode.insertBefore(dragging, target);
        } else {
          target.parentNode.insertBefore(dragging, target.nextSibling);
        }
        target.classList.remove(
          'drag-over-before', 'drag-over-after', 'drag-reject');
        // Collect the new order of ALL same-session reorderable
        // rows currently in the drawer. Done rows / cross-session
        // rows aren't in this set so they don't pollute the order.
        const orderedIds = Array.from(
          root.querySelectorAll(
            '.drawer-task.reorderable[data-session-id="' + cssEscape(sid) + '"]'
          )
        ).map(function(el) { return el.dataset.taskId; }).filter(Boolean);
        if (orderedIds.length < 2) return;
        send('taskReorder', { sessionId: sid, orderedIds: orderedIds });
      });
    });

    // "+ add task" link → expand into the add-form.
    root.querySelectorAll('[data-action="drawer-add-open"]').forEach(function(el) {
      el.addEventListener('click', function(ev) {
        ev.stopPropagation();
        const cwd = el.dataset.cwd || '';
        _drawerAddCwd = cwd;
        // Pre-seed the draft with default session = first in group.
        if (!_drawerAddDrafts.has(cwd)) {
          const g = (_drawerData && _drawerData.groups || []).find(function(x) { return x.cwd === cwd; });
          const firstSid = g && g.sessions && g.sessions[0] && g.sessions[0].id || '';
          _drawerAddDrafts.set(cwd, { content: '', sessionId: firstSid });
        }
        renderDrawer(_drawerData);
        // Focus the input.
        const inp = root.querySelector(
          'input[data-drawer-add-input][data-cwd="' + cssEscape(cwd) + '"]'
        );
        if (inp) inp.focus();
      });
    });

    // The add-form input — Enter saves, Esc cancels, input tracks
    // draft. Tasks created here are UNATTACHED by default: the
    // taskCreateUnattached bridge action stores them under the
    // project's pseudo-session id so the user can attach later via
    // the per-row ↗ attach affordance.
    root.querySelectorAll('input[data-drawer-add-input]').forEach(function(inp) {
      const cwd = inp.getAttribute('data-cwd') || '';
      inp.addEventListener('input', function() {
        const draft = _drawerAddDrafts.get(cwd) || { content: '' };
        draft.content = inp.value;
        _drawerAddDrafts.set(cwd, draft);
      });
      inp.addEventListener('keydown', function(ev) {
        ev.stopPropagation();
        if (ev.key === 'Enter') {
          ev.preventDefault();
          const text = (inp.value || '').trim();
          if (!text) return;
          send('taskCreateUnattached', { cwd: cwd, content: text });
          // Reset state. The Python refresh that follows will close
          // the form by re-rendering with _drawerAddCwd null.
          _drawerAddCwd = null;
          _drawerAddDrafts.delete(cwd);
        } else if (ev.key === 'Escape') {
          ev.preventDefault();
          _drawerAddCwd = null;
          _drawerAddDrafts.delete(cwd);
          renderDrawer(_drawerData);
        }
      });
      inp.addEventListener('click', function(ev) { ev.stopPropagation(); });
    });

    // Legacy add-form session picker — kept as a no-op safety net
    // in case any cached payload still contains pick-chip nodes
    // mid-rollout. The new flow has no picker chip; tasks created
    // in the drawer go unattached and are attached afterward.
    root.querySelectorAll('[data-action="drawer-pick-session"]').forEach(function(el) {
      el.addEventListener('click', function(ev) {
        ev.stopPropagation();
        const cwd = el.dataset.cwd || '';
        const currentSid = el.dataset.sessionId || '';
        openSessionPicker(el, cwd, currentSid, function(newSid) {
          if (!newSid) return;
          const draft = _drawerAddDrafts.get(cwd) || { content: '', sessionId: '' };
          draft.sessionId = newSid;
          _drawerAddDrafts.set(cwd, draft);
          renderDrawer(_drawerData);
        });
      });
    });
  }

  // Floating session-picker popover. Lists sessions in the given
  // group (by cwd) so the user can pick a different one. The
  // `onPick` callback receives the chosen session id. Click outside
  // to dismiss.
  let _activePicker = null;
  function openSessionPicker(anchorEl, cwd, currentSid, onPick) {
    if (_activePicker) {
      _activePicker.remove();
      _activePicker = null;
    }
    const group = (_drawerData && _drawerData.groups || []).find(function(g) { return g.cwd === cwd; });
    const sessions = (group && group.sessions) || [];

    const pop = document.createElement('div');
    pop.className = 'session-picker-popover';
    pop.innerHTML = '<div class="session-picker-head">Sessions in this project</div>'
      + (sessions.length === 0
          ? '<div class="session-picker-empty">No sessions in this project.</div>'
          : sessions.map(function(s) {
              const isCurrent = s.id === currentSid;
              const glyph =
                s.bucket === 'working' ? '◐' :
                s.bucket === 'ready'   ? '●' : '○';
              return '<div class="session-picker-item bucket-' + esc(s.bucket || 'dormant')
                + (isCurrent ? ' current' : '') + '" data-sid="' + esc(s.id || '') + '">'
                + '<span class="sdot">' + glyph + '</span>'
                + '<span class="stitle">' + esc(s.title || '') + '</span>'
                + (s.phase ? '<span class="sphase">' + esc(s.phase) + '</span>' : '')
                + (isCurrent ? '<span class="current-tag">CURRENT</span>' : '')
                + '</div>';
            }).join(''));
    document.body.appendChild(pop);
    _activePicker = pop;

    // Position relative to anchor. Default: below the anchor,
    // right-aligned. Flip if it would overflow the viewport.
    const ar = anchorEl.getBoundingClientRect();
    pop.style.top = (ar.bottom + 4) + 'px';
    pop.style.left = Math.max(8, ar.right - pop.offsetWidth) + 'px';
    const pr = pop.getBoundingClientRect();
    if (pr.right > window.innerWidth - 4) {
      pop.style.left = Math.max(8, window.innerWidth - pr.width - 8) + 'px';
    }
    if (pr.bottom > window.innerHeight - 4) {
      pop.style.top = Math.max(4, ar.top - pr.height - 4) + 'px';
    }

    pop.querySelectorAll('.session-picker-item').forEach(function(item) {
      item.addEventListener('click', function(ev) {
        ev.stopPropagation();
        const sid = item.dataset.sid || '';
        if (_activePicker) { _activePicker.remove(); _activePicker = null; }
        onPick(sid);
      });
    });

    // Dismiss on outside click. Defer one tick so the same click
    // that opened the picker doesn't immediately close it.
    setTimeout(function() {
      const dismissOnce = function(ev) {
        if (!pop.contains(ev.target)) {
          if (_activePicker) { _activePicker.remove(); _activePicker = null; }
          document.removeEventListener('click', dismissOnce, true);
        }
      };
      document.addEventListener('click', dismissOnce, true);
    }, 0);
  }

  // ===========================================================
  // Per-task: copy prompt + start-in-folder modal.
  // -----------------------------------------------------------
  // Both affordances live on every user-authored task row (per-
  // card + drawer). Copy writes the task text to the clipboard
  // via navigator.clipboard with a Python pbcopy fallback. Start
  // opens the modal below, pre-filled with the task text; on
  // confirm we POST {prompt, cwd} to Python which spawns a new
  // Terminal at that folder running `claude <prompt>`.
  // ===========================================================
  function copyTaskPrompt(text) {
    if (!text) return;
    // Try the modern Clipboard API first. WKWebView may consider
    // itself a non-secure context and reject; fall back to Python
    // pbcopy via the bridge so the action always works.
    let usedModern = false;
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).catch(function() {
          // Promise rejection — fall through to bridge.
          send('taskCopy', { content: text });
        });
        usedModern = true;
      }
    } catch (e) { /* permission / API missing */ }
    if (!usedModern) send('taskCopy', { content: text });
  }

  // Friendlier folder display: collapse $HOME to ~ when present,
  // then keep only the last 2 path components so the modal head
  // stays scannable for deep paths like "~/code/.../app".
  function shortFolder(cwd) {
    if (!cwd) return '~';
    const parts = cwd.split('/').filter(Boolean);
    if (parts.length <= 2) return cwd || '~';
    return '…/' + parts.slice(-2).join('/');
  }

  // ---- New-session launch config controls (permission mode + new/
  // existing session) as segmented pills. Pre-filled from
  // window.__startConfig (pushed by Python), read back on confirm, and
  // previewed live as a `claude …` command. ----
  const TSM_PERM_MODES = ['default', 'acceptEdits', 'plan', 'bypass'];
  const TSM_SESSION_TARGETS = ['new', 'existing'];
  const TSM_LOCATIONS = ['same', 'worktree'];

  // Segmented control get/set: the active <button>'s data-value is the
  // value; selecting one clears its siblings.
  function segGet(groupId) {
    const on = document.querySelector('#' + groupId + ' .tsm-seg-btn.active');
    return on ? on.getAttribute('data-value') : null;
  }
  function segSet(groupId, value, fallback) {
    const group = document.getElementById(groupId);
    if (!group) return;
    const btns = group.querySelectorAll('.tsm-seg-btn');
    let matched = false;
    btns.forEach(function(b) {
      const on = b.getAttribute('data-value') === value;
      b.classList.toggle('active', on);
      if (on) matched = true;
    });
    if (!matched && btns.length) {
      // Never leave a control with nothing selected — snap to fallback.
      const want = fallback || btns[0].getAttribute('data-value');
      btns.forEach(function(b) {
        b.classList.toggle('active', b.getAttribute('data-value') === want);
      });
    }
  }

  // ---- Resume picker: a custom dropdown with status dots, matching the
  // task-attach session picker. Sessions come straight from the last
  // payload Python pushed (_lastData.buckets), filtered to the modal's
  // folder — so it works even when the drawer was never opened. ----
  let _tsmResumeSessions = [];   // sessions in the modal's folder, newest first
  let _tsmResumeSid = '';        // chosen session id ('' = none → --continue)

  function _resumeGlyph(bucket) {
    return bucket === 'working' ? '◐' : bucket === 'ready' ? '●' : '○';
  }
  function _resumeLabel(s) {
    return (s.title && s.title !== '(untitled)') ? s.title : (s.gist || 'session');
  }
  // Rebuild the session list for a folder; default selection is the most
  // recent. Re-renders the menu + trigger.
  function populateResumeOptions(cwd) {
    const buckets = (_lastData && _lastData.buckets) || {};
    const rows = [];
    // Require a non-empty cwd so an unattached task (which can carry an
    // empty cwd) doesn't lump together every cwd-less session.
    ['needs', 'working', 'ready', 'dormant'].forEach(function(k) {
      (buckets[k] || []).forEach(function(r) {
        if (r && r.sessionId && cwd && r.cwd === cwd) rows.push(r);
      });
    });
    rows.sort(function(a, b) { return (a.ago_s || 0) - (b.ago_s || 0); });  // newest first
    _tsmResumeSessions = rows;
    _tsmResumeSid = rows.length ? rows[0].sessionId : '';   // default: most recent
    renderResumeMenu();
    updateResumeTrigger();
  }
  function renderResumeMenu() {
    const menu = document.getElementById('tsm-resume-menu');
    if (!menu) return;
    if (!_tsmResumeSessions.length) {
      menu.innerHTML = '<div class="session-picker-empty">No tracked sessions in this folder.</div>';
      return;
    }
    menu.innerHTML = _tsmResumeSessions.map(function(s) {
      const cur = s.sessionId === _tsmResumeSid;
      return '<div class="session-picker-item bucket-' + esc(s.bucket || 'dormant')
        + (cur ? ' current' : '') + '" role="option" data-sid="' + esc(s.sessionId) + '">'
        + '<span class="sdot">' + _resumeGlyph(s.bucket) + '</span>'
        + '<span class="stitle">' + esc(_resumeLabel(s)) + '</span>'
        + (s.age ? '<span class="sphase">' + esc(s.age) + '</span>' : '')
        + '</div>';
    }).join('');
  }
  function updateResumeTrigger() {
    const trigger = document.getElementById('tsm-resume-trigger');
    const dot = document.getElementById('tsm-resume-dot');
    const label = document.getElementById('tsm-resume-label');
    if (!trigger || !dot || !label) return;
    trigger.classList.remove('bucket-working', 'bucket-needs', 'bucket-ready', 'bucket-dormant');
    if (!_tsmResumeSessions.length) {
      trigger.disabled = true;
      dot.textContent = '○';
      label.textContent = 'No tracked sessions — uses most recent';
      return;
    }
    trigger.disabled = false;
    const sel = _tsmResumeSessions.find(function(s) { return s.sessionId === _tsmResumeSid; }) || _tsmResumeSessions[0];
    trigger.classList.add('bucket-' + (sel.bucket || 'dormant'));
    dot.textContent = _resumeGlyph(sel.bucket);
    label.textContent = _resumeLabel(sel) + (sel.age ? ('  ·  ' + sel.age) : '');
  }
  // Place the menu so it stays inside the ~480px-tall popover window:
  // open downward by default, but flip upward when there isn't room
  // below, and cap the height to the available space so rows are never
  // clipped by the WKWebView edge.
  function placeResumeMenu() {
    const menu = document.getElementById('tsm-resume-menu');
    const trigger = document.getElementById('tsm-resume-trigger');
    if (!menu || !trigger) return;
    const r = trigger.getBoundingClientRect();
    const margin = 8;
    const spaceBelow = window.innerHeight - r.bottom - margin;
    const spaceAbove = r.top - margin;
    const DESIRED = 216;
    const down = spaceBelow >= Math.min(DESIRED, 140) || spaceBelow >= spaceAbove;
    if (down) {
      menu.style.top = 'calc(100% + 4px)';
      menu.style.bottom = 'auto';
      menu.style.maxHeight = Math.max(96, Math.min(DESIRED, spaceBelow)) + 'px';
    } else {
      menu.style.top = 'auto';
      menu.style.bottom = 'calc(100% + 4px)';
      menu.style.maxHeight = Math.max(96, Math.min(DESIRED, spaceAbove)) + 'px';
    }
  }
  function toggleResumeMenu(show) {
    const menu = document.getElementById('tsm-resume-menu');
    const trigger = document.getElementById('tsm-resume-trigger');
    if (!menu || !trigger) return;
    const open = (show === undefined) ? menu.hasAttribute('hidden') : show;
    if (open && !trigger.disabled) {
      renderResumeMenu();
      menu.removeAttribute('hidden');
      placeResumeMenu();   // flip up / clamp height so nothing is clipped
      trigger.setAttribute('aria-expanded', 'true');
    } else {
      menu.setAttribute('hidden', '');
      trigger.setAttribute('aria-expanded', 'false');
    }
  }
  // The resume picker only matters for an existing session in the *same*
  // code — a new worktree is always a fresh session. Show it exactly when
  // that combination holds, and close the menu otherwise.
  function syncResumeVisibility() {
    const show = segGet('tsm-session') === 'existing' && segGet('tsm-location') !== 'worktree';
    const row = document.getElementById('tsm-resume-row');
    if (row) row.style.display = show ? 'flex' : 'none';
    if (!show) toggleResumeMenu(false);
  }
  // A new worktree is inherently a new session, so hide the Session +
  // Resume controls when "New worktree" is selected.
  function syncLocationVisibility() {
    const worktree = segGet('tsm-location') === 'worktree';
    const srow = document.getElementById('tsm-session-row');
    if (srow) srow.style.display = worktree ? 'none' : 'flex';
    syncResumeVisibility();
  }

  function applyStartConfig(sc) {
    sc = sc || {};
    segSet('tsm-location', TSM_LOCATIONS.indexOf(sc.location) >= 0 ? sc.location : 'same', 'same');
    segSet('tsm-session', TSM_SESSION_TARGETS.indexOf(sc.sessionTarget) >= 0 ? sc.sessionTarget : 'new', 'new');
    segSet('tsm-perm', TSM_PERM_MODES.indexOf(sc.permissionMode) >= 0 ? sc.permissionMode : 'default', 'default');
    syncLocationVisibility();
    updateStartCmdPreview();
  }
  function collectStartConfig() {
    const location = segGet('tsm-location') || 'same';
    const target = segGet('tsm-session') || 'new';
    // Validate the chosen id against the *current* session list before
    // sending it: a background refresh can age the selected session out
    // of _lastData while the modal sits open, in which case the trigger
    // already falls back to most-recent for display — mirror that here
    // so the sent --resume id never diverges from what's shown.
    let rid = '';
    if (location !== 'worktree' && target === 'existing' && _tsmResumeSessions.length) {
      const valid = _tsmResumeSessions.some(function(s) { return s.sessionId === _tsmResumeSid; });
      rid = valid ? _tsmResumeSid : _tsmResumeSessions[0].sessionId;
    }
    return {
      permissionMode: segGet('tsm-perm') || 'default',
      sessionTarget: target,
      location: location,
      resumeSessionId: rid,
    };
  }
  // Mirror floating.py so the preview matches the command that will run.
  function updateStartCmdPreview() {
    const el = document.getElementById('tsm-cmd');
    if (!el) return;
    const sc = collectStartConfig();
    const perm = [];
    if (sc.permissionMode === 'bypass') perm.push('--dangerously-skip-permissions');
    else if (sc.permissionMode === 'acceptEdits' || sc.permissionMode === 'plan') perm.push('--permission-mode', sc.permissionMode);
    let parts;
    if (sc.location === 'worktree') {
      // Fresh worktree → new branch + session; resume/continue don't apply.
      parts = ['git worktree add …  &&  claude'].concat(perm);
    } else {
      parts = ['claude'].concat(perm);
      if (sc.sessionTarget === 'existing') {
        if (sc.resumeSessionId) parts.push('--resume', sc.resumeSessionId.slice(0, 8) + '…');
        else parts.push('--continue');
      }
    }
    el.innerHTML = '<b>' + esc(parts.join(' ')) + '</b> "…"';
  }

  let _tsmCwd = '';            // captured at open time
  function openTaskStartModal(prompt, cwd) {
    const modal = document.getElementById('task-start-modal');
    const folderEl = document.getElementById('tsm-folder');
    const promptEl = document.getElementById('tsm-prompt');
    if (!modal || !folderEl || !promptEl) return;
    _tsmCwd = cwd || '';
    folderEl.textContent = shortFolder(cwd);
    promptEl.value = prompt || '';
    populateResumeOptions(_tsmCwd);
    applyStartConfig(window.__startConfig || {});
    modal.classList.add('open');
    modal.setAttribute('aria-hidden', 'false');
    // Focus + select-all so the user can either keep the task
    // text verbatim or replace it with one keystroke.
    setTimeout(function() {
      promptEl.focus();
      try { promptEl.select(); } catch (e) { /* ignore */ }
    }, 0);
  }
  function closeTaskStartModal() {
    const modal = document.getElementById('task-start-modal');
    if (!modal) return;
    toggleResumeMenu(false);
    modal.classList.remove('open');
    modal.setAttribute('aria-hidden', 'true');
    _tsmCwd = '';
  }
  function confirmTaskStart() {
    const promptEl = document.getElementById('tsm-prompt');
    if (!promptEl) return;
    const text = (promptEl.value || '').trim();
    if (!text) return;
    // Send to Python — it persists this launch config as last-used,
    // spawns Terminal with the matching `claude` flags, + closes the
    // popover.
    send('taskStart', {
      prompt: text,
      cwd: _tsmCwd,
      startConfigJson: JSON.stringify(collectStartConfig()),
    });
    closeTaskStartModal();
  }
  // Wire modal controls once at script load.
  document.addEventListener('DOMContentLoaded', function() {
    const cancelBtn = document.getElementById('tsm-cancel');
    const confirmBtn = document.getElementById('tsm-confirm');
    const promptEl = document.getElementById('tsm-prompt');
    const modal = document.getElementById('task-start-modal');
    if (cancelBtn) cancelBtn.addEventListener('click', closeTaskStartModal);
    if (confirmBtn) confirmBtn.addEventListener('click', confirmTaskStart);
    // Segmented controls: clicking a pill selects it (clearing its
    // siblings), reveals the resume picker when "Existing" is chosen,
    // and updates the live `claude …` command preview.
    ['tsm-location', 'tsm-session', 'tsm-perm'].forEach(function(groupId) {
      const group = document.getElementById(groupId);
      if (!group) return;
      group.addEventListener('click', function(ev) {
        const btn = ev.target.closest('.tsm-seg-btn');
        if (!btn || !group.contains(btn)) return;
        segSet(groupId, btn.getAttribute('data-value'));
        if (groupId === 'tsm-location') syncLocationVisibility();
        else if (groupId === 'tsm-session') syncResumeVisibility();
        updateStartCmdPreview();
      });
    });
    // Resume picker: trigger toggles the menu; clicking a row selects
    // that session and updates the trigger + preview.
    const resumeTrigger = document.getElementById('tsm-resume-trigger');
    if (resumeTrigger) {
      resumeTrigger.addEventListener('click', function(ev) {
        ev.stopPropagation();
        toggleResumeMenu();
      });
    }
    const resumeMenu = document.getElementById('tsm-resume-menu');
    if (resumeMenu) {
      resumeMenu.addEventListener('click', function(ev) {
        const item = ev.target.closest('.session-picker-item');
        if (!item) return;
        ev.stopPropagation();
        _tsmResumeSid = item.getAttribute('data-sid') || '';
        updateResumeTrigger();
        toggleResumeMenu(false);
        updateStartCmdPreview();
      });
    }
    // Click anywhere else in the modal closes the open resume menu.
    if (modal) {
      modal.addEventListener('click', function(ev) {
        const wrap = document.getElementById('tsm-resume-wrap');
        if (wrap && !wrap.contains(ev.target)) toggleResumeMenu(false);
      });
    }
    if (modal) {
      // Click on the dim backdrop (but not the card) cancels.
      modal.addEventListener('click', function(ev) {
        if (ev.target === modal) closeTaskStartModal();
      });
    }
    if (promptEl) {
      promptEl.addEventListener('keydown', function(ev) {
        // Cmd+Enter (or Ctrl+Enter) = confirm. Plain Enter is left
        // alone so multi-line prompts work naturally.
        if (ev.key === 'Enter' && (ev.metaKey || ev.ctrlKey)) {
          ev.preventDefault();
          confirmTaskStart();
        } else if (ev.key === 'Escape') {
          ev.preventDefault();
          closeTaskStartModal();
        }
      });
    }
    // Esc handler at document level so users can cancel even when
    // focus has drifted off the textarea.
    document.addEventListener('keydown', function(ev) {
      if (ev.key === 'Escape') {
        const m = document.getElementById('task-start-modal');
        if (m && m.classList.contains('open')) closeTaskStartModal();
      }
    });
  }, { once: true });

  // Escape any HTML in user-supplied strings before inserting via
  // innerHTML. We use textContent where possible but composite rows
  // assemble template strings — this keeps the join cheap and safe.
  function esc(s) {
    if (s == null) return '';
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  // Build the inner HTML for one card. `row` is the slim JSON object
  // sent from Python — see _serialize_row in floating.py for the
  // exact field list.
  function renderCard(row) {
    const bucket = row.bucket || 'dormant';
    const glyph = COL_GLYPH[bucket] || '○';
    const titleSafe = esc(row.title || '(untitled)');
    const folder = esc(row.folder || '');
    const age = esc(row.age || '');
    const unread = row.unread === true;

    // Phase·gist line — phase in muted secondary, gist in primary.
    let phaseGist = '';
    const hasPhase = !!row.phase;
    const hasGist = !!row.gist;
    if (hasPhase || hasGist) {
      let parts = [];
      if (hasPhase) parts.push('<span class="phase">' + esc(row.phase) + '</span>');
      if (hasPhase && hasGist) parts.push('<span class="dotsep">·</span>');
      if (hasGist) parts.push('<span class="gist">' + esc(row.gist) + '</span>');
      phaseGist = '<div class="phase-gist">' + parts.join('') + '</div>';
    }

    // Folder + age metadata line.
    let metaLine = '';
    if (folder || age) {
      metaLine = '<div class="meta">'
        + (folder ? '<span class="folder">' + folder + '</span>' : '')
        + (folder && age ? '<span class="sep">·</span>' : '')
        + (age ? '<span class="age">' + age + '</span>' : '')
        + '</div>';
    }

    // Sub-agent block — running agents listed, then an aggregate
    // footer for any overflow + done/interrupted counts.
    let subBlock = '';
    const subs = Array.isArray(row.subagents) ? row.subagents : [];
    const running = subs.filter(function(s) { return s.state === 'running'; });
    const doneCount = subs.filter(function(s) { return s.state === 'done'; }).length;
    const interruptedCount = subs.filter(function(s) { return s.state === 'interrupted'; }).length;
    const SHOW_MAX = 5;
    const shown = running.slice(0, SHOW_MAX);
    const overflow = running.length - shown.length;

    if (shown.length > 0 || doneCount > 0 || interruptedCount > 0) {
      let lines = shown.map(function(s) {
        const type = esc(s.type || '');
        const desc = esc(s.desc || '');
        return '<div class="agent-line">'
          + '<span class="state-glyph">◐</span>'   // ◐ for running
          + (type ? '<span class="type">' + type + '</span>' : '')
          + (type && desc ? '<span class="sep">·</span>' : '')
          + '<span class="desc">' + desc + '</span>'
          + '</div>';
      });
      // Aggregate footer
      const footerParts = [];
      if (overflow > 0) footerParts.push('+ ' + overflow + ' more working');
      if (doneCount > 0) footerParts.push(doneCount + ' done');
      if (interruptedCount > 0) footerParts.push(interruptedCount + ' interrupted');
      let footer = '';
      if (footerParts.length > 0) {
        // Lead with "+" only if there's no overflow already prefixed.
        const prefix = (overflow > 0) ? '' : '+ ';
        footer = '<div class="agent-footer">' + prefix + footerParts.join(' · ') + '</div>';
      }
      subBlock = '<div class="subagents">' + lines.join('') + footer + '</div>';
    }

    // ---- Tasks block ----
    // Renders between meta and subagents. Hidden entirely when the
    // session has zero tasks AND we're not in list-mode (where we
    // always show the + add affordance even on empty cards) AND the
    // card isn't currently expanded for creation.
    const tasksBlock = renderTasksBlock(row);

    // The clickable unread dot — only rendered when unread is true.
    // We attach the click handler in the post-render wiring step so
    // we can stop event propagation (don't trigger the card's
    // resume-on-click when the user is just marking-as-read).
    const unreadEl = unread
      ? '<span class="unread-dot" data-action="mark-read"></span>'
      : '';

    return ''
      + '<div class="title-row">'
      +   '<span class="dot">' + esc(glyph) + '</span>'
      +   '<span class="title">' + titleSafe + '</span>'
      + '</div>'
      + phaseGist
      + metaLine
      + tasksBlock
      + subBlock
      + unreadEl;
  }

  // Render the per-card tasks block (between meta and subagents).
  // Behavior:
  //   - Dormant cards: fraction-only label, no rows, no expansion.
  //   - List mode: always full list + + add input.
  //   - Kanban mode, collapsed: label + up to 2 preview rows + "+N more".
  //   - Kanban mode, expanded: full list + suggestion divider + add input.
  //   - Cards with zero tasks: block hidden unless list-mode (always show
  //     the + add affordance there so creation is one click away).
  function renderTasksBlock(row) {
    const tasks = Array.isArray(row.tasks) ? row.tasks : [];
    const bucket = row.bucket || 'dormant';
    const isDormant = bucket === 'dormant';
    const isList = document.body.classList.contains('mode-list');
    const sid = row.sessionId || '';
    const expanded = expandedCards.has(sid);

    const total = tasks.length;
    const done = tasks.filter(function(t) { return t.status === 'done'; }).length;
    const openTasks = tasks.filter(function(t) {
      return t.status === 'open' && (t.source !== 'suggested' || t.approved);
    });
    const suggested = tasks.filter(function(t) {
      return t.status === 'open' && t.source === 'suggested' && !t.approved;
    });
    const doneTasks = tasks.filter(function(t) { return t.status === 'done'; });

    // Dormant cards used to collapse to just the fraction — the user
    // overrode that: tasks in dormant sessions stay visible. So dormant
    // now falls through to the normal render path; only the card title
    // dimming (handled in CSS) still distinguishes dormant visually.

    // Empty card — surface a "+ add task" affordance so the user can
    // create the FIRST task without needing an expand target that
    // doesn't exist yet. Click expands the card and reveals the
    // input. List mode falls through to the regular render below
    // which always shows the input row anyway.
    if (total === 0 && !isList && !expanded) {
      return '<div class="tasks empty-tasks">'
        + '<div class="tasks-label add-affordance" data-toggle="1">'
        +   '<span class="chev">+</span>'
        +   '<span>add task</span>'
        + '</div>'
        + '</div>';
    }

    // Decide what subset of tasks to show.
    // List mode + kanban-expanded: show all open + all suggested +
    // recently-done (cap at 2). Kanban collapsed: 2 preview rows.
    const showAll = isList || expanded;
    const PREVIEW_MAX = 2;

    let rowsHtml = '';
    let hiddenCount = 0;
    if (showAll) {
      // Open user tasks
      rowsHtml += openTasks.map(taskRowHtml).join('');
      // Suggested (with divider if there are any)
      if (suggested.length > 0) {
        rowsHtml += '<div class="sugg-divider"><span>suggested by Haiku</span></div>';
        rowsHtml += suggested.map(taskRowHtml).join('');
      }
      // Done tasks render behind a collapsible pill — the user
      // wants completed work out of the way by default, but still
      // reachable in one click. Default state = collapsed (sid NOT
      // in doneRevealed). Clicking the pill reveals all done rows
      // and flips the affordance to a "▾ hide N done" toggle.
      if (doneTasks.length > 0) {
        const revealed = doneRevealed.has(sid);
        if (revealed) {
          rowsHtml += '<div class="done-toggle revealed" data-toggle-done="1" title="Hide completed tasks">'
            + '<span class="chev">▾</span>'
            + '<span>hide ' + doneTasks.length + ' done</span>'
            + '</div>';
          // Show ALL done rows when revealed — no slice cap. The
          // user explicitly asked to see them; trust the click.
          rowsHtml += doneTasks.map(taskRowHtml).join('');
        } else {
          rowsHtml += '<div class="done-toggle" data-toggle-done="1" title="Show completed tasks">'
            + '<span class="chev">▸</span>'
            + '<span class="dot">●</span>'
            + '<span>' + doneTasks.length + ' done</span>'
            + '</div>';
        }
      }
    } else {
      // Collapsed: prioritize open user tasks first, then suggestions
      // if we have room. Done tasks never appear in preview.
      const previewOpen = openTasks.slice(0, PREVIEW_MAX);
      rowsHtml += previewOpen.map(taskRowHtml).join('');
      // If we have room, show 1 suggestion preview as a teaser.
      const remainingSlots = PREVIEW_MAX - previewOpen.length;
      if (remainingSlots > 0 && suggested.length > 0) {
        rowsHtml += suggested.slice(0, remainingSlots).map(taskRowHtml).join('');
      }
      const previewCount = previewOpen.length
        + Math.min(remainingSlots, suggested.length);
      hiddenCount = (openTasks.length + suggested.length + doneTasks.length)
        - previewCount;
    }

    const moreEl = (hiddenCount > 0)
      ? '<div class="more" data-toggle="1">+ ' + hiddenCount + ' more</div>'
      : '';

    // The + add input or its affordance:
    //   - List mode: always show the input (room to spare).
    //   - Kanban + expanded: show the input.
    //   - Kanban + collapsed + non-empty: show a quiet "+ add task"
    //     link that expands the card on click (auto-focus handled by
    //     rerenderOneCard). Without this, users with one existing
    //     task on a collapsed card see no obvious way to add another.
    //   - Kanban + collapsed + zero tasks: handled above by the
    //     empty-state add-affordance branch — never reaches here.
    let addEl;
    if (isList || expanded) {
      addEl = renderAddTaskInput(sid);
    } else {
      addEl = '<div class="add-task-link" data-toggle="1">+ add task</div>';
    }

    return '<div class="tasks">'
      + '<div class="tasks-label" data-toggle="1">'
      +   '<span class="chev">▸</span>'
      +   '<span>tasks</span>'
      +   '<span class="frac">(' + done + '/' + total + ')</span>'
      + '</div>'
      + rowsHtml
      + moreEl
      + addEl
      + '</div>';
  }

  function taskRowHtml(t) {
    // Defensive: a malformed payload could push a non-object into
    // tasks[]. Render nothing rather than throwing on t.status.
    if (!t || typeof t !== 'object') return '';
    const status = t.status || 'open';
    const isSuggested = t.source === 'suggested' && !t.approved;
    const cls = isSuggested ? 'suggested' : status;  // 'open' | 'done' | 'suggested'
    const glyph =
      isSuggested ? '⋄' :
      status === 'done' ? '●' : '○';
    const tid = esc(t.id || '');

    // Editable iff this is a user-authored task (suggested rows stay
    // read-only until approved). Surface a hint via title attribute
    // + a class the CSS can latch onto for hover feedback.
    const isEditable = !isSuggested;
    const inEdit = isEditable && editingTasks.has(t.id);
    const draftValue = inEdit ? (editingTasks.get(t.id) || '') : null;

    // Text element: a span in view mode, an <input> in edit mode.
    // The input reuses the same data-task-id so handlers can route
    // to the right task regardless of which row was clicked.
    const textEl = inEdit
      ? '<input class="ttext-edit" type="text"'
        + ' data-action="task-edit-input" data-task-id="' + tid + '"'
        + ' value="' + esc(draftValue !== null ? draftValue : (t.content || '')) + '" />'
      // No native `title` attribute — the browser's default tooltip
      // would either say "Click to edit" (misleading) or duplicate
      // the visible content. The custom hover tooltip handler in
      // wireCardClicks shows the full task description for
      // truncated rows; nothing else needs a tooltip.
      : '<span class="ttext' + (isEditable ? ' editable' : '') + '"'
        + (isEditable ? ' data-action="task-edit-begin" data-task-id="' + tid + '"' : '')
        + '>' + esc(t.content || '') + '</span>';

    // Trailing controls: suggestions get ✓/✗; user tasks get
    // [copy][start][×]. Copy writes the task text to the clipboard;
    // start opens the prompt-edit modal then launches `claude` in
    // the task's folder. All three fade in on row hover so the
    // resting state stays calm. Hidden while editing so the input
    // has the full row width.
    // draggable="false" on each control + the wrapper keeps the
    // row's draggable="true" from inheriting onto them, so a
    // mousedown over a button doesn't show the grab cursor and
    // doesn't accidentally start a drag instead of clicking.
    const tail = inEdit ? '' : (isSuggested
      ? '<span class="ctrls" draggable="false">'
        + '<span class="ctrl approve" data-action="task-approve" data-task-id="' + tid + '" title="Approve" draggable="false">✓</span>'
        + '<span class="ctrl reject"  data-action="task-reject"  data-task-id="' + tid + '" title="Reject" draggable="false">✗</span>'
        + '</span>'
      : '<span class="ctrls user" draggable="false">'
        + '<span class="ctrl tcopy"   data-action="task-copy"   data-task-id="' + tid + '" title="Copy prompt" draggable="false">📋</span>'
        + '<span class="ctrl tstart"  data-action="task-start"  data-task-id="' + tid + '" title="Start in this folder" draggable="false">▶</span>'
        + '<span class="ctrl tdelete" data-action="task-delete" data-task-id="' + tid + '" title="Delete" draggable="false">×</span>'
        + '</span>');
    // Drag-to-reorder: only OPEN user-authored rows are draggable.
    // Done rows are sort-locked by completedAt; suggestions are
    // sort-locked by bucket. The draggable attribute is itself only
    // set when not in edit mode (a draggable input is confusing —
    // the browser would intercept text-selection drag for reorder).
    const isReorderable = isEditable && status === 'open' && !inEdit;
    // `draggable="false"` on the glyph keeps a mousedown there from
    // initiating a row drag — the click still toggles open/done.
    // Without this the row's draggable="true" inherits, the OS shows
    // the grab cursor over the glyph, and a slow click can get
    // swallowed by a drag start.
    return '<div class="task-row ' + cls + (inEdit ? ' editing' : '')
      + (isReorderable ? ' reorderable' : '') + '"'
      + ' data-task-id="' + tid + '"'
      + (isReorderable ? ' draggable="true"' : '')
      + '>'
      + '<span class="tglyph" data-action="task-toggle" data-task-id="' + tid + '"'
      +   (isReorderable ? ' draggable="false"' : '') + '>' + glyph + '</span>'
      + textEl
      + tail
      + '</div>';
  }

  function renderAddTaskInput(sid) {
    const draft = esc(draftFocus.get(sid) || '');
    return '<div class="add-task" data-action="add-task-row">'
      + '<span class="plus">+</span>'
      + '<input type="text" data-action="add-task-input" data-session="' + esc(sid) + '"'
      + ' value="' + draft + '"'
      + ' placeholder="Add a task — Enter to save" />'
      + '</div>';
  }

  // Last-rendered payload JSON. Used to dedupe identical refreshes —
  // when Python's 5s tick pushes data that's byte-identical to what
  // we already painted, we skip the full innerHTML rebuild that would
  // otherwise shuffle every card's DOM identity (and visually flicker
  // / shift heights as the browser re-lays everything out).
  let _lastPayloadJson = null;

  // Last-rendered "shape" — the columns and the ordered sessionIds
  // in each. When the new payload's shape matches, we do per-card
  // content updates (cardEl divs stay put, only innerHTML changes)
  // so cards don't visually jump on every age-tick refresh. Shape
  // changes (new/removed session, bucket transition, dormant toggle)
  // fall back to a full DOM rebuild.
  let _lastShape = null;

  // Per-session cache of the last innerHTML we painted into each card,
  // keyed by sessionId. The per-card update path consults this so a
  // tick that changed ONE card (e.g. a freshly-active session whose
  // "5s"→"10s" age busts the payload dedupe) only rewrites that card's
  // DOM — every other card, with byte-identical HTML, is left
  // untouched. Without this, a single ticking card forced an
  // innerHTML swap on all ~20 cards, collapsing hover/selection state
  // across the board. GC'd alongside the other per-session Sets below.
  const _cardHtml = new Map();

  function sameShape(a, b) {
    if (!a || !b) return false;
    if (a.length !== b.length) return false;
    for (let i = 0; i < a.length; i++) {
      if (a[i].key !== b[i].key) return false;
      const xs = a[i].sids, ys = b[i].sids;
      if (xs.length !== ys.length) return false;
      for (let j = 0; j < xs.length; j++) if (xs[j] !== ys[j]) return false;
    }
    return true;
  }

  // Escape a value for safe use inside a CSS attribute selector.
  // Session IDs in production are UUIDs (safe), but the in-test
  // values and any future schema change shouldn't trip the selector.
  function cssEscape(s) {
    if (typeof CSS !== 'undefined' && CSS.escape) return CSS.escape(s);
    return String(s).replace(/[^a-zA-Z0-9_-]/g, function(c) {
      return '\\' + c.charCodeAt(0).toString(16) + ' ';
    });
  }

  // Top-level render. Replaces the whole #app subtree on every refresh
  // — cheap because there are O(20) cards total and we're not in a
  // tight animation loop. But idle refreshes still cause visible
  // micro-jumps from the rebuild, so dedupe via JSON-string compare
  // first; in steady state most refreshes are no-ops.
  function renderApp(data) {
    const app = document.getElementById('app');
    if (!app) return;
    // Cache the latest payload for sidebar-triggered re-renders.
    // Sidebar clicks need to rebuild the kanban with a new filter
    // applied — they call renderApp(_lastData) after updating the
    // selection. Set BEFORE the dedupe check so the cache is fresh
    // even on a no-op render.
    _lastData = data;

    // Stash the last-used new-session launch config so the start modal
    // pre-fills its controls. Set before the dedupe return so it stays
    // fresh even on a no-op render tick.
    if (data && data.startConfig) window.__startConfig = data.startConfig;

    // Dedupe identical payloads — skip the whole rebuild so cards
    // don't visually jump on quiet refresh ticks. Comparison cost is
    // O(payload size, ~5KB) which is dwarfed by the innerHTML +
    // wireClicks work it avoids. Stringify failures (circular refs,
    // unlikely from Python) fall through to render as before.
    // NOTE: sidebar selection clicks bust this by setting
    // `_lastPayloadJson = null` so the re-render fires even though
    // the Python payload is bytes-identical.
    // The dedupe signature OMITS each row's `ago_s` — that float
    // advances on every 5s tick but drives no rendering decision the
    // `age` string doesn't already capture (the sidebar's "Today"
    // filter flips at 24h, exactly where format_ago flips "23h ago"
    // → "1d ago"). Including it made every quiet tick miss the dedupe
    // and rebuild the whole app — sidebar, drawer, every card —
    // yanking the user out of whatever they were doing. With it gone,
    // a tick that only advanced the clock short-circuits here. The
    // full `data` (with ago_s intact) is still cached in `_lastData`
    // above, so the Today filter keeps working.
    let payloadJson = null;
    try {
      payloadJson = JSON.stringify(data, function(key, value) {
        return key === 'ago_s' ? undefined : value;
      });
    } catch (_) {}
    if (payloadJson !== null && payloadJson === _lastPayloadJson) return;
    _lastPayloadJson = payloadJson;

    // Hide any visible hover tooltip + cancel pending show-timer.
    // If we don't, an in-flight refresh that replaces the .ttext
    // element under the cursor leaves the tooltip orphaned in the
    // body — the mouseleave on the detached element never fires.
    _hideTaskTooltip();

    // Apply the mode class to the body so all our mode-{kanban,list}
    // CSS rules can target the right layout. Defaults to kanban when
    // the payload omits it (back-compat with older Python builds).
    const mode = (data.mode === 'list') ? 'list' : 'kanban';
    document.body.classList.remove('mode-list', 'mode-kanban');
    document.body.classList.add('mode-' + mode);
    app.classList.toggle('with-dormant', !!data.showDormant);

    // Remember which input had focus + cursor position so we can
    // restore it after the innerHTML replacement. Without this, a 5s
    // background refresh would yank focus out of the user's typing —
    // both the + add-task input and the inline task-edit input.
    // `activeElement` is normally non-null (defaults to <body>) but
    // be defensive — and `.matches` isn't on every element type.
    const activeEl = document.activeElement;
    let focusKind = null;     // 'add' | 'edit' | null
    let focusKey = null;      // sessionId for 'add', taskId for 'edit'
    let focusCaret = 0;
    if (activeEl && typeof activeEl.matches === 'function') {
      if (activeEl.matches('input[data-action="add-task-input"]')) {
        focusKind = 'add';
        focusKey = activeEl.dataset.session || null;
        focusCaret = activeEl.selectionStart || 0;
      } else if (activeEl.matches('input[data-action="task-edit-input"]')) {
        focusKind = 'edit';
        focusKey = activeEl.dataset.taskId || null;
        focusCaret = activeEl.selectionStart || 0;
      }
    }

    // Populate row cache so rerenderOneCard() (used by expand/collapse)
    // can rebuild a single card without a fresh Python push.
    lastRows.clear();

    // Render the left rail (Idea 2.α). Done BEFORE filtering the
    // buckets so the rail always shows the unfiltered totals + per-
    // project counts — clicking a project should not make the rail
    // itself shrink. List mode hides the sidebar via CSS; we still
    // call renderSidebar so it clears any stale content.
    renderSidebar(data.sidebar);

    // Apply the sidebar selection as a client-side filter to the
    // bucket payload. The columns code below renders from the
    // filtered view so counts + card lists reflect the user's pick.
    const buckets = filterBuckets(data.buckets || {}, _sidebarSelection);

    // Derive the set of sessionIds that survived the filter — passed
    // to the drawer so its groups + tasks track the same view as the
    // kanban. When the user picks a project, the drawer narrows to
    // that project's tasks; when they pick Needs you / Today, the
    // drawer narrows to tasks from sessions in those smart views.
    // null = no filter (sidebar selection is All-projects).
    let visibleSids = null;
    if (_sidebarSelection && _sidebarSelection.kind !== 'all') {
      visibleSids = new Set();
      ['needs','working','ready','dormant'].forEach(function(key) {
        (buckets[key] || []).forEach(function(r) {
          if (r.sessionId) visibleSids.add(r.sessionId);
        });
      });
    }

    // Compute the new card layout (which sessions in which columns).
    // If this matches what's currently in the DOM, we can do a per-
    // card content update — cards stay in place, only their inner
    // HTML changes — which preserves hover state and avoids the
    // visible "jump" that happens when the whole #app subtree is
    // replaced and the browser re-lays everything out.
    const newShape = [];  // array of {key, sids: [sessionId, ...]}
    COL_KEYS.forEach(function(key) {
      if (key === 'dormant' && !data.showDormant) return;
      const rows = buckets[key] || [];
      newShape.push({ key: key, sids: rows.map(function(r){ return r.sessionId || ''; }) });
      rows.forEach(function(r) { if (r.sessionId) lastRows.set(r.sessionId, r); });
    });

    const shapeSame = sameShape(newShape, _lastShape) && app.children.length > 0;

    if (shapeSame) {
      // ---- Per-card update path ----
      // Same sessions in the same columns. Walk the existing cardEls
      // in place and replace ONLY their innerHTML. CardEl divs (and
      // their position in the column) are not touched, so cards do
      // not jump. Listeners on cardEl (resume click) persist because
      // wireCardClicks gates that on a dataset flag.
      newShape.forEach(function(colSpec) {
        const colEl = app.querySelector('.col[data-key="' + colSpec.key + '"]');
        if (!colEl) return;
        // Update header count
        const countEl = colEl.querySelector('.col-header .count');
        if (countEl) countEl.textContent = String(colSpec.sids.length);
        // Per-card content update
        const rows = buckets[colSpec.key] || [];
        rows.forEach(function(r) {
          const cardEl = colEl.querySelector(
            '.card[data-session="' + cssEscape(r.sessionId) + '"]'
          );
          if (!cardEl) return;
          // Reflect possibly-changed bucket / unread / expanded class
          const newClass = 'card ' + (r.bucket || 'dormant')
            + (r.unread ? ' is-unread' : '')
            + (expandedCards.has(r.sessionId) ? ' expanded' : '');
          const newCwd = r.cwd || '';
          const newHtml = renderCard(r);
          // Skip the DOM write entirely when nothing about this card
          // changed — same class, same cwd, byte-identical body. This
          // is the common case on a quiet tick: one card's clock
          // advanced, the rest are untouched, so we leave their DOM
          // (and any hover/focus/scroll state) exactly as-is.
          if (cardEl.className === newClass
              && cardEl.dataset.cwd === newCwd
              && _cardHtml.get(r.sessionId) === newHtml) {
            return;
          }
          if (cardEl.className !== newClass) cardEl.className = newClass;
          if (cardEl.dataset.cwd !== newCwd) cardEl.dataset.cwd = newCwd;
          cardEl.innerHTML = newHtml;
          _cardHtml.set(r.sessionId, newHtml);
          // Re-wire the (new) inner children. cardEl-level click
          // listener was attached on initial wire and survives via
          // the data-body-wired flag.
          wireCardClicks(cardEl);
        });
      });
    } else {
      // ---- Full rebuild path ----
      // Shape changed (card moved buckets, new session, gone session,
      // dormant toggled). Repaint the whole #app subtree.
      const cols = [];
      COL_KEYS.forEach(function(key) {
        if (key === 'dormant' && !data.showDormant) return;
        const rows = buckets[key] || [];
        const count = rows.length;
        const label = COL_LABELS[key] || key;
        const cards = rows.length
          ? rows.map(function(r) {
              const isExpanded = expandedCards.has(r.sessionId);
              // Seed the per-card HTML cache so the next tick's per-card
              // path can skip cards whose body didn't change. Mirrors
              // exactly what we hand to innerHTML there.
              const body = renderCard(r);
              _cardHtml.set(r.sessionId, body);
              return '<div class="card ' + esc(r.bucket)
                + (r.unread ? ' is-unread' : '')
                + (isExpanded ? ' expanded' : '')
                + '" data-session="' + esc(r.sessionId)
                + '" data-cwd="' + esc(r.cwd || '')
                + '">' + body + '</div>';
            }).join('')
          : '<div class="empty">—</div>';
        cols.push(''
          + '<div class="col" data-key="' + esc(key) + '">'
          +   '<div class="col-header">'
          +     '<span class="label">' + esc(label) + '</span>'
          +     '<span class="count">' + count + '</span>'
          +   '</div>'
          +   '<div class="col-body">' + cards + '</div>'
          + '</div>'
        );
      });
      app.innerHTML = cols.join('');
      // Wire click handlers AFTER the DOM is replaced.
      wireClicks();
    }
    _lastShape = newShape;

    // Refresh the right-side tasks drawer with the latest data.
    // Cheap — drawer DOM is small; safe to do on every render.
    // Second arg is the sidebar's visible-session-ids set so the
    // drawer mirrors the kanban's filter; null when nothing is
    // filtered (the All-projects default).
    renderDrawer(data.drawer, visibleSids);

    // Garbage-collect stale per-card state: any session that's no
    // longer in the current payload (dormant promoted out of view,
    // session deleted on disk, etc.) shouldn't keep accumulating
    // expansion / draft entries over the badge's lifetime.
    expandedCards.forEach(function(sid) {
      if (!lastRows.has(sid)) expandedCards.delete(sid);
    });
    draftFocus.forEach(function(_v, sid) {
      if (!lastRows.has(sid)) draftFocus.delete(sid);
    });
    doneRevealed.forEach(function(sid) {
      if (!lastRows.has(sid)) doneRevealed.delete(sid);
    });
    _cardHtml.forEach(function(_v, sid) {
      if (!lastRows.has(sid)) _cardHtml.delete(sid);
    });
    // Same sweep for the drawer's per-cwd done-revealed Set. Cwds
    // that no longer appear as a drawer group are stale; otherwise
    // toggling done-collapse in a project that closes out leaves
    // ghosts in this Set for the rest of the WKWebView's lifetime.
    if (drawerDoneRevealed.size > 0) {
      const liveCwds = new Set(
        ((_drawerData && _drawerData.groups) || []).map(function(g) { return g.cwd || ''; })
      );
      drawerDoneRevealed.forEach(function(cwd) {
        if (!liveCwds.has(cwd)) drawerDoneRevealed.delete(cwd);
      });
    }

    // Restore focus + caret if the user was typing into either of
    // the two input kinds (+ add-task or inline task edit) when the
    // refresh fired. Find by the input's keying attribute.
    if (focusKind && focusKey) {
      const selector = focusKind === 'add'
        ? 'input[data-action="add-task-input"][data-session="' + cssEscape(focusKey) + '"]'
        : 'input[data-action="task-edit-input"][data-task-id="' + cssEscape(focusKey) + '"]';
      const inp = document.querySelector(selector);
      if (inp) {
        inp.focus();
        try { inp.setSelectionRange(focusCaret, focusCaret); }
        catch (e) { /* selection unavailable on some input types — fine */ }
      }
    }
  }

  // Top-level wiring after a full renderApp() — walks every card and
  // delegates to wireCardClicks for each. Used only on the full
  // refresh path; partial rerenders (expand/collapse) call
  // wireCardClicks on a single element to avoid attaching duplicate
  // listeners to every OTHER card on every interaction.
  function wireClicks() {
    document.querySelectorAll('.card').forEach(wireCardClicks);
  }

  // Wire every interactive handler within a single card's subtree.
  // Safe to call on a freshly-rendered card AND on a partially-rerendered
  // card (where cardEl itself persists across the innerHTML swap): the
  // card-body resume listener is gated by a dataset flag so it's
  // attached at most once per cardEl lifetime, and the inner per-element
  // listeners are always against freshly-replaced children so there's
  // no duplication risk.
  // ---- Tooltip for truncated task text ----
  // A single floating div appended to <body>. Shown on hover over a
  // .ttext element whose contents overflow horizontally (i.e. the
  // text is clipped with `…`). Position is computed once at hover
  // entry — we don't follow the cursor, since chasing the mouse is
  // distracting. Falls within the viewport via a simple flip-axis
  // check when the default below-right placement would clip.
  let _taskTooltipEl = null;
  let _taskTooltipTimer = null;
  function _getTaskTooltip() {
    if (!_taskTooltipEl) {
      _taskTooltipEl = document.createElement('div');
      _taskTooltipEl.className = 'task-tooltip';
      document.body.appendChild(_taskTooltipEl);
    }
    return _taskTooltipEl;
  }
  function _showTaskTooltip(text, cursorX, cursorY) {
    const tt = _getTaskTooltip();
    tt.textContent = text;
    tt.style.display = 'block';
    tt.style.left = '0px';
    tt.style.top = '0px';
    // Measure now that text + width are in the DOM.
    const offsetX = 12, offsetY = 14;
    let left = cursorX + offsetX;
    let top = cursorY + offsetY;
    const rect = tt.getBoundingClientRect();
    // Flip horizontally if the tooltip would clip the right edge.
    if (left + rect.width > window.innerWidth - 4) {
      left = Math.max(4, cursorX - rect.width - offsetX);
    }
    // Flip vertically if it would clip the bottom edge.
    if (top + rect.height > window.innerHeight - 4) {
      top = Math.max(4, cursorY - rect.height - offsetY);
    }
    tt.style.left = left + 'px';
    tt.style.top = top + 'px';
    // Trigger the fade-in via class toggle (display:block already
    // applied above; opacity transitions from 0 → 1).
    requestAnimationFrame(function() { tt.classList.add('visible'); });
  }
  function _hideTaskTooltip() {
    if (_taskTooltipTimer) { clearTimeout(_taskTooltipTimer); _taskTooltipTimer = null; }
    if (_taskTooltipEl) {
      _taskTooltipEl.classList.remove('visible');
      _taskTooltipEl.style.display = 'none';
    }
  }

  function wireCardClicks(cardEl) {
    if (!cardEl) return;

    // Card body → resume session in its host. ONLY attach if not
    // already wired — a partial rerender (expand/collapse) keeps
    // cardEl alive and re-running this would stack listeners,
    // causing every resume click to fire 2+ times. The dataset flag
    // is cleared automatically when cardEl is replaced wholesale
    // by the next full renderApp() tick.
    if (!cardEl.dataset.bodyWired) {
      cardEl.addEventListener('click', function(ev) {
        const target = ev.target;
        if (!target) return;
        if (target.closest('.tasks')) return;
        if (target.closest('[data-action]')) return;
        if (target.closest('input,textarea')) return;
        send('resume', {
          sessionId: cardEl.dataset.session || '',
          cwd: cardEl.dataset.cwd || '',
        });
      });
      cardEl.dataset.bodyWired = '1';
    }

    // Unread dot → mark-read.
    cardEl.querySelectorAll('[data-action="mark-read"]').forEach(function(el) {
      el.addEventListener('click', function(ev) {
        ev.stopPropagation();
        send('markRead', { sessionId: cardEl.dataset.session || '' });
      });
    });

    // Tasks-label or "+N more" → toggle card expansion. Kanban only —
    // list mode always shows the full list.
    cardEl.querySelectorAll('[data-toggle="1"]').forEach(function(el) {
      el.addEventListener('click', function(ev) {
        ev.stopPropagation();
        if (document.body.classList.contains('mode-list')) return;
        const sid = cardEl.dataset.session || '';
        if (!sid) return;
        if (expandedCards.has(sid)) expandedCards.delete(sid);
        else expandedCards.add(sid);
        rerenderOneCard(cardEl);
      });
    });

    // "▸ ● N done" / "▾ hide N done" pill → toggle whether the
    // done-task rows are visible inside this card. Distinct from
    // expandedCards (which expands the WHOLE card); this only
    // affects the done-tasks sub-block. List mode honors this too
    // so the user can fold done work out of the way without losing
    // the otherwise-uncapped task list.
    cardEl.querySelectorAll('[data-toggle-done="1"]').forEach(function(el) {
      el.addEventListener('click', function(ev) {
        ev.stopPropagation();
        const sid = cardEl.dataset.session || '';
        if (!sid) return;
        if (doneRevealed.has(sid)) doneRevealed.delete(sid);
        else doneRevealed.add(sid);
        rerenderOneCard(cardEl);
      });
    });

    // Task glyph → toggle open/done.
    cardEl.querySelectorAll('[data-action="task-toggle"]').forEach(function(el) {
      el.addEventListener('click', function(ev) {
        ev.stopPropagation();
        const tid = el.dataset.taskId;
        if (!tid) return;
        send('taskToggle', {
          sessionId: cardEl.dataset.session || '',
          taskId: tid,
        });
      });
    });

    // Click task text → enter edit mode. The current row is swapped
    // to render an <input> via rerenderOneCard; the input gets focus
    // + caret-at-end on the new render. Only user-authored rows
    // expose this affordance (suggestions get the ✓/✗ controls).
    //
    // Focus is deferred via requestAnimationFrame so WebKit's
    // post-click focus resolution (which decides keyboard focus
    // based on the original click target) doesn't race against our
    // programmatic .focus() on a freshly-rendered element. Without
    // this defer, keystrokes can land outside the input even though
    // the input has DOM focus.
    cardEl.querySelectorAll('[data-action="task-edit-begin"]').forEach(function(el) {
      el.addEventListener('click', function(ev) {
        ev.stopPropagation();
        const tid = el.dataset.taskId;
        if (!tid) return;
        const row = lastRows.get(cardEl.dataset.session || '');
        const t = row && (row.tasks || []).find(function(x) { return x.id === tid; });
        editingTasks.set(tid, (t && t.content) || '');
        rerenderOneCard(cardEl);
        // Defer focus to the next frame so WebKit's click-handling
        // doesn't immediately re-claim focus elsewhere.
        const focusInput = function() {
          const inp = cardEl.querySelector(
            'input[data-action="task-edit-input"][data-task-id="' + tid + '"]'
          );
          if (!inp) return;
          inp.focus();
          const len = (inp.value || '').length;
          try { inp.setSelectionRange(len, len); } catch (e) { /* ok */ }
        };
        if (typeof requestAnimationFrame === 'function') {
          requestAnimationFrame(focusInput);
        } else {
          setTimeout(focusInput, 0);
        }
      });
    });

    // Inline task-edit input — Enter saves, Esc cancels, blur saves
    // when changed / cancels when unchanged. Mirrors the behavior of
    // the + add-task input but routes to taskEdit instead of
    // taskCreate.
    cardEl.querySelectorAll('input[data-action="task-edit-input"]').forEach(function(inp) {
      const tid = inp.dataset.taskId;
      if (!tid) return;
      const row = lastRows.get(cardEl.dataset.session || '');
      const original = (row && (row.tasks || []).find(function(x) { return x.id === tid; }) || {}).content || '';

      // Local flag so the keyup-Enter fallback doesn't fire a second
      // taskEdit after the keydown-Enter already committed. Without
      // this guard, the input persists until the Python refresh
      // round-trips back, and during that window both keydown AND
      // keyup fire on the same Enter press → two taskEdit messages
      // with identical content → duplicate stderr lines + redundant
      // refresh. Idempotent for content but noisy.
      let committed = false;
      const commit = function(why) {
        if (committed) return;
        committed = true;
        const text = (inp.value || '').trim();
        if (!text) {
          editingTasks.delete(tid);
          rerenderOneCard(cardEl);
          return;
        }
        if (text === original) {
          // Unchanged — just exit edit mode, no Python round-trip.
          editingTasks.delete(tid);
          rerenderOneCard(cardEl);
          return;
        }
        send('taskEdit', {
          sessionId: cardEl.dataset.session || '',
          taskId: tid,
          content: text,
          // Helps trace in /tmp/floating.log when diagnosing
          // "Enter doesn't save" — we'll see whether the commit
          // fired from Enter or blur or whatever.
          source: why || 'unknown',
        });
        editingTasks.delete(tid);
      };

      inp.addEventListener('input', function() {
        editingTasks.set(tid, inp.value);
      });
      // Keydown: detect Enter via multiple identifiers so an IME or
      // a quirky layout doesn't silently swallow the commit. Some
      // bridges report key='Process' or keyCode=229 during IME
      // composition, and a later 'keyup' carries the real Enter —
      // so we also bind keyup for the Enter fallback path.
      const isEnter = function(ev) {
        return ev.key === 'Enter' || ev.keyCode === 13 || ev.which === 13;
      };
      const isEscape = function(ev) {
        return ev.key === 'Escape' || ev.keyCode === 27 || ev.which === 27;
      };
      inp.addEventListener('keydown', function(ev) {
        ev.stopPropagation();
        if (isEnter(ev)) {
          ev.preventDefault();
          commit('enter-keydown');
        } else if (isEscape(ev)) {
          ev.preventDefault();
          editingTasks.delete(tid);
          rerenderOneCard(cardEl);
        }
      });
      // Defensive fallback: some keyboards / IME setups fire Enter
      // only as keyup. If we already committed via keydown, the
      // input is destroyed by the next refresh and this handler
      // is harmless.
      inp.addEventListener('keyup', function(ev) {
        if (isEnter(ev) && document.body.contains(inp)) {
          ev.preventDefault();
          commit('enter-keyup');
        }
      });
      inp.addEventListener('blur', function() { commit('blur'); });
      inp.addEventListener('click', function(ev) { ev.stopPropagation(); });
    });

    // Drag-to-reorder. Only .reorderable rows (open user-authored,
    // non-editing) get dragstart/dragover/drop handlers. The
    // insertion point is computed from the cursor's Y position
    // relative to the target row's vertical midpoint — above the
    // midpoint = insert before, below = insert after. On drop, we
    // collect the new order of task-id attributes within the
    // .tasks container and post taskReorder. Python rewrites
    // positions + refreshes the popover.
    cardEl.querySelectorAll('.task-row.reorderable').forEach(function(rowEl) {
      rowEl.addEventListener('dragstart', function(ev) {
        if (!ev.dataTransfer) return;
        ev.dataTransfer.effectAllowed = 'move';
        // Some browsers require something in dataTransfer for the
        // drag to "stick"; the task-id doubles as a small payload.
        try { ev.dataTransfer.setData('text/plain', rowEl.dataset.taskId || ''); }
        catch (e) { /* some browsers throw on setData here */ }
        rowEl.classList.add('dragging');
        document.body.classList.add('dragging-task');
        // Hide hover tooltip during drag — otherwise it lingers
        // mid-air over a node that's been visually faded.
        _hideTaskTooltip();
      });
      rowEl.addEventListener('dragend', function() {
        // Defensive global cleanup. If a Python refresh fired during
        // the drag (5s tick), the original rowEl is now detached and
        // a brand-new DOM has the .dragging class on a different
        // element — clearing on `rowEl` alone would leak the visual
        // state. Sweep the whole document so no zombie classes
        // survive regardless of refresh timing.
        document.querySelectorAll(
          '.task-row.dragging, .task-row.drag-over-before, .task-row.drag-over-after'
        ).forEach(function(el) {
          el.classList.remove('dragging', 'drag-over-before', 'drag-over-after');
        });
        document.body.classList.remove('dragging-task');
      });
    });

    // Dragover/drop handlers attach to ALL reorderable rows as drop
    // targets (a dragged row can land before OR after any other
    // reorderable row).
    cardEl.querySelectorAll('.task-row.reorderable').forEach(function(target) {
      target.addEventListener('dragover', function(ev) {
        const dragging = cardEl.querySelector('.task-row.dragging');
        if (!dragging || dragging === target) return;
        ev.preventDefault();  // allow drop
        if (ev.dataTransfer) ev.dataTransfer.dropEffect = 'move';
        // Decide insertion point based on cursor Y vs target midpoint.
        const rect = target.getBoundingClientRect();
        const isBefore = (ev.clientY - rect.top) < (rect.height / 2);
        target.classList.toggle('drag-over-before', isBefore);
        target.classList.toggle('drag-over-after', !isBefore);
      });
      target.addEventListener('dragleave', function() {
        target.classList.remove('drag-over-before', 'drag-over-after');
      });
      target.addEventListener('drop', function(ev) {
        const dragging = cardEl.querySelector('.task-row.dragging');
        if (!dragging || dragging === target) return;
        ev.preventDefault();
        const rect = target.getBoundingClientRect();
        const isBefore = (ev.clientY - rect.top) < (rect.height / 2);
        // Move the dragged row in the DOM so the insertion is
        // immediate (optimistic UI). The Python refresh that arrives
        // ~100ms later will confirm the order.
        if (isBefore) {
          target.parentNode.insertBefore(dragging, target);
        } else {
          target.parentNode.insertBefore(dragging, target.nextSibling);
        }
        target.classList.remove('drag-over-before', 'drag-over-after');
        // Collect the new order of ALL reorderable rows in this card.
        // Only IDs of open user-authored rows; done / suggestions
        // keep their bucket-based sort and don't need to be sent.
        const orderedIds = Array.from(
          cardEl.querySelectorAll('.task-row.reorderable')
        ).map(function(el) { return el.dataset.taskId; }).filter(Boolean);
        if (orderedIds.length < 2) return;
        send('taskReorder', {
          sessionId: cardEl.dataset.session || '',
          orderedIds: orderedIds,
        });
      });
    });

    // Hover on task text → show the full content in a floating
    // tooltip near the cursor. Shown for ALL task rows on hover
    // (not gated on truncation) so the behavior is consistent
    // regardless of column width or wrap state. 220ms delay keeps
    // it from popping up on accidental mouseovers.
    cardEl.querySelectorAll('.task-row .ttext').forEach(function(ttextEl) {
      ttextEl.addEventListener('mouseenter', function(ev) {
        const text = ttextEl.textContent || '';
        if (!text) return;
        const x = ev.clientX, y = ev.clientY;
        if (_taskTooltipTimer) clearTimeout(_taskTooltipTimer);
        _taskTooltipTimer = setTimeout(function() {
          _showTaskTooltip(text, x, y);
        }, 220);
      });
      ttextEl.addEventListener('mouseleave', _hideTaskTooltip);
    });

    // Hover × → delete user-authored task.
    cardEl.querySelectorAll('[data-action="task-delete"]').forEach(function(el) {
      el.addEventListener('click', function(ev) {
        ev.stopPropagation();
        const tid = el.dataset.taskId;
        if (!tid) return;
        send('taskDelete', {
          sessionId: cardEl.dataset.session || '',
          taskId: tid,
        });
      });
    });

    // 📋 copy → write task content to clipboard.
    cardEl.querySelectorAll('[data-action="task-copy"]').forEach(function(el) {
      el.addEventListener('click', function(ev) {
        ev.stopPropagation();
        const tid = el.dataset.taskId;
        if (!tid) return;
        const row = lastRows.get(cardEl.dataset.session || '');
        const t = row && (row.tasks || []).find(function(x) { return x.id === tid; });
        if (!t) return;
        copyTaskPrompt(t.content || '');
      });
    });

    // ▶ start → open prompt-edit modal, then launch claude in cwd.
    cardEl.querySelectorAll('[data-action="task-start"]').forEach(function(el) {
      el.addEventListener('click', function(ev) {
        ev.stopPropagation();
        const tid = el.dataset.taskId;
        if (!tid) return;
        const row = lastRows.get(cardEl.dataset.session || '');
        const t = row && (row.tasks || []).find(function(x) { return x.id === tid; });
        if (!t) return;
