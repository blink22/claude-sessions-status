<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Kanban</title>
<style>
  :root {
    --bg-popover:       #1c1c20;
    --bg-popover-lift:  #232328;
    --hairline:         rgba(255,255,255,0.06);
    --hairline-strong:  rgba(255,255,255,0.10);
    --border-card:      rgba(255,255,255,0.04);
    --card-bg:          rgba(255,255,255,0.025);
    --text-1:           rgba(255,255,255,0.92);
    --text-2:           rgba(255,255,255,0.55);
    --text-3:           rgba(255,255,255,0.36);
    --text-4:           rgba(255,255,255,0.22);
    --red:              #f06f6f;
    --amber:            #e0b34a;
    --green:            #4fc78a;
    --teal:             #5dd0cf;
    --blue:             #6aa6f8;
    --mono:             "SF Mono", ui-monospace, Menlo, monospace;
    --sans:             -apple-system, "SF Pro Text", "SF Pro Display", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
  }
  body {
    font-family: var(--sans);
    font-size: 13px;
    background: var(--bg-popover);
    color: var(--text-1);
    /* Smoother text — matches native AppKit antialiasing better. */
    -webkit-font-smoothing: antialiased;
  }
  /* ===========================================================
   * Layout — KANBAN mode (3 or 4 columns side by side)
   * =========================================================== */
  body.mode-kanban #app {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    height: 100vh;
    background: var(--bg-popover);
  }
  body.mode-kanban #app.with-dormant {
    grid-template-columns: 1fr 1fr 1fr 1fr;
  }
  body.mode-kanban .col {
    /* Linear's layered surface — column body sits 3-4% brighter than
     * the popover bg, so the eye reads the columns as distinct panes
     * floating on the popover floor. */
    background: var(--bg-popover-lift);
    border-right: 1px solid var(--hairline);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    min-width: 0;
  }
  body.mode-kanban .col:last-child { border-right: 0; }

  /* ===========================================================
   * Layout — LIST mode (vertical stack of sections, one card-wide)
   * Reuses the same .col / .col-header / .col-body / .card markup
   * as kanban — just changes how they're laid out.
   * =========================================================== */
  body.mode-list #app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    /* The popover is narrow in list mode (~360px) — one scrollable
     * container holds the whole stack so the user scrolls once, not
     * per-section. */
    overflow-y: auto;
    overflow-x: hidden;
    background: var(--bg-popover);
    scrollbar-width: thin;
  }
  body.mode-list #app::-webkit-scrollbar { width: 6px; }
  body.mode-list #app::-webkit-scrollbar-track { background: transparent; }
  body.mode-list #app::-webkit-scrollbar-thumb {
    background: rgba(255,255,255,0.10);
    border-radius: 3px;
  }
  body.mode-list #app::-webkit-scrollbar-thumb:hover {
    background: rgba(255,255,255,0.18);
  }
  body.mode-list .col {
    background: transparent;
    border-bottom: 1px solid var(--hairline);
    /* Sections flow vertically; no fixed height. */
    display: block;
    flex: 0 0 auto;
  }
  body.mode-list .col:last-child { border-bottom: 0; }
  /* In list mode the section header doesn't need to stick — the
   * outer scroll container handles all scrolling. Make it visually
   * more prominent than the column-header variant since it's the
   * only thing organizing the cards in a 1-up layout. */
  body.mode-list .col-header {
    background: var(--bg-popover);
    padding: 14px 14px 8px;
  }
  body.mode-list .col-header .label {
    font-size: 11px;
  }
  body.mode-list .col-body {
    overflow: visible;
    padding: 4px 12px 12px;
  }
  /* List-mode cards: slightly more breathing room since they're
   * wider and there's no horizontal column boundary doing the
   * spacing for us. */
  body.mode-list .card { margin-bottom: 8px; }

  .col {
    min-width: 0;
  }

  .col-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 12px 14px 10px;
    border-bottom: 1px solid var(--hairline);
    /* Sticky-style: the header is OUTSIDE the scrollable area so
     * cards scroll under it. */
    flex: 0 0 auto;
    background: var(--bg-popover-lift);
  }
  .col-header .label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-3);
  }
  .col-header .count {
    font-size: 11px;
    color: var(--text-4);
    font-variant-numeric: tabular-nums;
    font-family: var(--mono);
  }

  .col-body {
    flex: 1 1 auto;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 8px 10px 12px;
    /* Hide the default macOS scroller until the user is interacting —
     * matches the overlay scroller behavior of native NSScrollView. */
    scrollbar-width: thin;
  }
  .col-body::-webkit-scrollbar { width: 6px; }
  .col-body::-webkit-scrollbar-track { background: transparent; }
  .col-body::-webkit-scrollbar-thumb {
    background: rgba(255,255,255,0.10);
    border-radius: 3px;
  }
  .col-body::-webkit-scrollbar-thumb:hover {
    background: rgba(255,255,255,0.18);
  }

  .empty {
    color: var(--text-4);
    font-size: 11px;
    padding: 8px 4px;
    text-align: center;
    font-style: italic;
  }

  /* ---- Card ---- */
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border-card);
    border-radius: 5px;
    padding: 8px 10px;
    margin-bottom: 6px;
    position: relative;
    cursor: pointer;
    /* The whole card is the click target for "resume in terminal".
     * Small affordance on hover so the user knows it's clickable. */
    transition: background 80ms ease, border-color 80ms ease;
  }
  .card:hover {
    background: rgba(255,255,255,0.045);
    border-color: var(--hairline-strong);
  }
  .card:active {
    background: rgba(255,255,255,0.06);
  }

  .card .title-row {
    display: flex;
    align-items: baseline;
    gap: 7px;
  }
  .card .dot {
    flex-shrink: 0;
    font-size: 12px;
    width: 12px;
    line-height: 1;
    text-align: center;
    margin-top: 1px;
  }
  .card.needs   .dot { color: var(--red); }
  .card.working .dot { color: var(--amber); }
  .card.ready   .dot { color: var(--green); }
  .card.dormant .dot { color: var(--text-3); }

  .card .title {
    font-size: 13px;
    font-weight: 500;
    color: var(--text-1);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 1 1 auto;
    min-width: 0;
  }

  /* Unread indicator — small blue dot, click to mark-as-read.
   * Positioned at top-right, doesn't disturb title flow. */
  .card .unread-dot {
    position: absolute;
    top: 9px;
    right: 10px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--blue);
    cursor: pointer;
  }
  .card .unread-dot:hover {
    box-shadow: 0 0 0 3px rgba(106, 166, 248, 0.15);
  }

  .card .phase-gist {
    font-size: 11px;
    color: var(--text-2);
    margin-top: 4px;
    margin-left: 19px;
    /* Wrap the description across multiple lines instead of
     * truncating with an ellipsis — the user wants the full gist
     * visible even if it spans 2-3 lines. */
    line-height: 1.45;
    word-wrap: break-word;
    overflow-wrap: break-word;
  }
  .card .phase-gist .phase {
    /* Phase label is a small pill/chip that visually separates from
     * the gist body — gives it a clear "this is the phase tag"
     * affordance the eye picks up before the description text. */
    display: inline-block;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.06);
    color: var(--text-1);
    font-weight: 600;
    text-transform: uppercase;
    font-size: 9px;
    letter-spacing: 0.05em;
    padding: 1px 6px;
    border-radius: 3px;
    /* Slightly raised baseline so the chip aligns with the gist
     * text's cap-height instead of dropping below it. */
    vertical-align: 1px;
  }
  /* Per-bucket tint — the chip picks up the status color of the
   * column the card lives in so it reinforces the signal without
   * shouting. Background stays neutral; border + text pick up tint. */
  .card.needs   .phase-gist .phase {
    color: var(--red);
    border-color: rgba(240,111,111,0.30);
    background: rgba(240,111,111,0.10);
  }
  .card.working .phase-gist .phase {
    color: var(--amber);
    border-color: rgba(224,179,74,0.30);
    background: rgba(224,179,74,0.10);
  }
  .card.ready .phase-gist .phase {
    color: var(--green);
    border-color: rgba(79,199,138,0.30);
    background: rgba(79,199,138,0.10);
  }
  .card.dormant .phase-gist .phase {
    color: var(--text-3);
    border-color: rgba(255,255,255,0.06);
    background: rgba(255,255,255,0.04);
  }
  .card .phase-gist .dotsep {
    /* Sits between the phase chip and the gist text — quiet middot
     * so the chip + dot + gist all read as a single tagline. */
    color: var(--text-3);
    margin: 0 6px;
    font-weight: 600;
  }
  .card .phase-gist .gist {
    color: var(--text-1);
    font-weight: 400;
  }

  .card .meta {
    font-size: 10px;
    color: var(--text-3);
    margin-top: 4px;
    font-variant-numeric: tabular-nums;
    font-family: var(--mono);
    margin-left: 19px;
    display: flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
  }
  .card .meta .folder {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    max-width: 70%;
  }
  .card .meta .sep {
    color: var(--text-4);
  }
  .card .meta .age {
    flex-shrink: 0;
  }

  /* ===========================================================
   * Tasks block — user-curated per-session list.
   * Sits between phase-gist/meta and the sub-agent block.
   * Hidden entirely when the session has zero tasks (and not
   * already expanded for creation).
   * =========================================================== */
  .card .tasks {
    margin-top: 8px;
    margin-left: 19px;
    border-top: 1px solid var(--hairline);
    padding-top: 6px;
  }
  .card .tasks-label {
    font-family: var(--mono);
    font-size: 9px;
    color: var(--text-3);
    letter-spacing: 0.05em;
    text-transform: uppercase;
    margin-bottom: 5px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    /* Beefier hit-zone padding so the toggle is a reliable target
     * even on the narrow 180px kanban column. */
    padding: 2px 0;
  }
  .card .tasks-label .frac { color: var(--text-4); font-weight: normal; }
  .card .tasks-label .chev {
    color: var(--text-4);
    font-size: 8px;
    transition: transform 120ms ease;
  }
  /* Card-level expanded state: chevron rotates, card lifts a notch */
  .card.expanded { background: rgba(255,255,255,0.04); border-color: var(--hairline-strong); }
  .card.expanded .tasks-label .chev { transform: rotate(90deg); }

  .card .task-row {
    font-size: 10.5px;
    line-height: 1.55;
    color: var(--text-1);
    display: flex;
    align-items: baseline;
    gap: 6px;
    overflow: hidden;
    position: relative;
    padding-right: 4px;
  }
  .card .task-row .tglyph {
    flex-shrink: 0;
    font-family: var(--mono);
    font-size: 11px;
    width: 12px;
    text-align: center;
    cursor: pointer;
    /* Padded so the glyph is a generous tap target. */
    padding: 0 2px;
  }
  .card .task-row .ttext {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    min-width: 0;
    flex: 1 1 auto;
  }
  /* Expanded cards let task text wrap so long entries stay readable. */
  .card.expanded .task-row .ttext { white-space: normal; }

  /* User-authored, open: glyph picks up the bucket color */
  .card .task-row.open .tglyph { color: var(--text-2); }
  .card.working .task-row.open .tglyph { color: var(--amber); }
  .card.needs   .task-row.open .tglyph { color: var(--red); }
  .card.ready   .task-row.open .tglyph { color: var(--green); }
  .card .task-row.open .ttext { color: var(--text-1); }
  /* User-authored, done */
  .card .task-row.done .tglyph { color: var(--text-4); }
  .card .task-row.done .ttext  { color: var(--text-4); }
  /* AI-suggested, pending approval */
  .card .task-row.suggested .tglyph { color: var(--text-3); }
  .card .task-row.suggested .ttext  { color: var(--text-2); font-style: italic; }

  /* Editable task text — hover hint that the row is clickable for
   * editing. Subtle: just a barely-perceptible underline so the
   * static look isn't noisy. */
  .card .task-row .ttext.editable {
    cursor: text;
    border-bottom: 1px dotted transparent;
    transition: border-color 120ms ease;
  }
  .card .task-row .ttext.editable:hover {
    border-bottom-color: rgba(255,255,255,0.15);
  }

  /* Inline edit input — replaces .ttext when the row enters edit
   * mode. Sized to fill the row width minus the glyph; styled to
   * blend with the surrounding row, with a focus state matching the
   * + add-task input for consistency. */
  .card .task-row .ttext-edit {
    flex: 1 1 auto;
    min-width: 0;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.10);
    border-radius: 3px;
    color: var(--text-1);
    padding: 1px 5px;
    font-family: var(--sans);
    font-size: 10.5px;
    line-height: 1.4;
    outline: none;
  }
  .card .task-row .ttext-edit:focus {
    border-color: rgba(106,166,248,0.40);
    background: rgba(106,166,248,0.06);
  }
  /* Suppress hover affordances on a row that's currently editing —
   * the row IS the edit affordance. */
  .card .task-row.editing { background: transparent; }
  .card .task-row.editing .tdelete,
  .card .task-row.editing .ctrls { display: none; }

  /* Hover-revealed delete affordance */
  .card .task-row .tdelete {
    margin-left: auto;
    color: var(--text-4);
    cursor: pointer;
    opacity: 0;
    font-size: 12px;
    line-height: 1;
    padding: 0 4px;
    transition: opacity 120ms ease, color 120ms ease;
  }
  .card .task-row:hover .tdelete { opacity: 1; }
  .card .task-row .tdelete:hover { color: var(--red); }

  /* Approve / reject controls on suggested rows */
  .card .task-row .ctrls {
    margin-left: auto;
    display: flex;
    gap: 3px;
    flex-shrink: 0;
  }
  .card .task-row .ctrl {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 16px; height: 16px;
    border-radius: 3px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    font-size: 10px;
    cursor: pointer;
    line-height: 1;
  }
  .card .task-row .ctrl.approve { color: var(--green); }
  .card .task-row .ctrl.reject  { color: var(--red); }
  .card .task-row .ctrl:hover { background: rgba(255,255,255,0.10); }

  /* "+ add task" link on collapsed kanban cards that already have
   * tasks. Hidden in list mode (the input is always visible there)
   * and on the expanded state (the input renders directly).
   *
   * Differentiated from the "+ N more" hint above it:
   *   - Sans serif (not mono) — pulls it out of the metadata family
   *   - Bumped a half-step in size (10.5 vs 9.5)
   *   - Subtle top hairline so it reads as a separate affordance
   *     section, not stacked with "+N more"
   *   - Hover lifts color two notches (text-4 → text-2) so the
   *     affordance is obviously interactive
   */
  .card .add-task-link {
    font-family: var(--sans);
    font-size: 10.5px;
    color: var(--text-3);
    margin-top: 5px;
    padding-top: 5px;
    cursor: pointer;
    /* Stretch the hit zone to the full card width so clicking
     * anywhere along the line expands — easier to hit than the
     * 8-character text. */
    display: block;
    border-top: 1px dashed rgba(255,255,255,0.05);
  }
  .card .add-task-link:hover { color: var(--text-1); }
  /* In list mode the input is always shown above this; suppress
   * any stray link rendering just in case. */
  body.mode-list .card .add-task-link { display: none; }

  /* "+N more" hint shown when the preview is truncated */
  .card .tasks .more {
    font-family: var(--mono);
    font-size: 9.5px;
    color: var(--text-4);
    margin-top: 4px;
    cursor: pointer;
  }
  .card .tasks .more:hover { color: var(--text-3); }

  /* Sub-divider above suggested tasks. */
  .card .tasks .sugg-divider {
    font-family: var(--mono);
    font-size: 8.5px;
    color: var(--text-4);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin: 8px 0 4px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .card .tasks .sugg-divider::before,
  .card .tasks .sugg-divider::after {
    content: ''; flex: 1; height: 0;
    border-top: 1px dashed rgba(255,255,255,0.08);
  }

  /* The "+ add task" input row */
  .card .add-task {
    margin-top: 6px;
    display: flex;
    gap: 6px;
    align-items: center;
    font-family: var(--mono);
    font-size: 10.5px;
  }
  .card .add-task .plus { color: var(--text-3); width: 12px; text-align: center; }
  .card .add-task input {
    flex: 1; min-width: 0;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.10);
    border-radius: 3px;
    color: var(--text-1);
    padding: 3px 6px;
    font-family: var(--sans);
    font-size: 11px;
    outline: none;
  }
  .card .add-task input::placeholder { color: var(--text-4); }
  .card .add-task input:focus {
    border-color: rgba(106,166,248,0.40);
    background: rgba(106,166,248,0.06);
  }

  /* Empty-card "+ add task" affordance — quieter than the regular
   * tasks-label so it doesn't shout on every card without tasks.
   * The "+" replaces the chevron (no fraction to show). Hover lifts
   * the color a notch to signal interactivity. */
  .card .tasks.empty-tasks { border-top: 0; padding-top: 4px; margin-top: 6px; }
  .card .tasks-label.add-affordance {
    color: var(--text-4);
    margin-bottom: 0;
  }
  .card .tasks-label.add-affordance .chev {
    transform: none !important;  /* "+" should never rotate */
    font-size: 11px;
    color: var(--text-4);
  }
  .card .tasks-label.add-affordance:hover { color: var(--text-2); }
  .card .tasks-label.add-affordance:hover .chev { color: var(--text-2); }
  /* When the card is expanded, the add-affordance is replaced by the
   * normal tasks-label (with the chevron + fraction) by the JS — so
   * the rotated-chevron rule still applies as expected. */

  /* Dormant cards used to collapse the tasks block to just the
   * fraction. The user overrode that — tasks in dormant sessions
   * stay fully visible (rows, "+ N more" expansion, "+ add task"
   * affordance) so they read like any other card. Only the title
   * dimming (declared further up) keeps dormant visually distinct. */

  /* List mode: tasks always show all rows + always-visible add input,
   * no expand/collapse — width is generous enough. */
  body.mode-list .card .tasks-label .chev { display: none; }
  body.mode-list .card .tasks-label { cursor: default; }
  body.mode-list .card .task-row .ttext { white-space: normal; }

  /* Sub-agent block — one row per running agent, then an aggregate
   * footer for completed/interrupted. Mirrors v0.3 behavior. */
  .card .subagents {
    margin-top: 6px;
    margin-left: 19px;
    border-top: 1px dashed rgba(255,255,255,0.06);
    padding-top: 6px;
  }
  .card .agent-line {
    font-family: var(--mono);
    font-size: 10px;
    line-height: 1.45;
    color: var(--text-2);
    /* Wrap the description across multiple lines when it's long
     * instead of clipping with an ellipsis. We can't keep the flex
     * row layout AND wrap text, so we drop flex and let the inline
     * children (◐ glyph, type, ·, desc) flow as normal inline text
     * — the desc continues onto a new line when it overflows, with
     * a hanging indent that lines up with the desc start. */
    word-wrap: break-word;
    overflow-wrap: break-word;
    /* Hanging indent: when the desc wraps, continuation lines sit
     * indented under the desc start (past the ◐ + type prefix)
     * instead of snapping back to the left edge. */
    padding-left: 1.4em;
    text-indent: -1.4em;
  }
  .card .agent-line .state-glyph {
    color: var(--teal);
    margin-right: 4px;
  }
  .card .agent-line .type {
    color: var(--text-3);
  }
  .card .agent-line .sep {
    color: var(--text-4);
    margin: 0 4px;
  }
  .card .agent-line .desc {
    color: var(--text-1);
  }
  .card .agent-footer {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-4);
    margin-top: 3px;
  }

  /* Dormant cards read in a single muted line — no phase, no gist,
   * no sub-agents. They're history. */
  .card.dormant .phase-gist,
  .card.dormant .subagents { display: none; }
  .card.dormant {
    opacity: 0.7;
  }
  .card.dormant .title { color: var(--text-2); font-weight: 400; }
</style>
</head>
<body>
<div id="app"></div>
<script>
(function() {
  'use strict';

  // Column order is fixed so we always render the four buckets in the
  // same left-to-right order regardless of object-key iteration order.
  const COL_KEYS = ['needs', 'working', 'ready', 'dormant'];
  const COL_LABELS = {
    needs:   'Needs You',
    working: 'Working',
    ready:   'Finished',
    dormant: 'Dormant',
  };
  // Status glyph per bucket. Circle states map to the v0.3.0 visual
  // language (○ idle / ◐ in-progress / ● done).
  const COL_GLYPH = {
    needs:   '○',   // ○ — needs attention
    working: '◐',   // ◐ — active
    ready:   '●',   // ● — finished
    dormant: '○',   // ○ — dormant
  };

  // ---- Bridge to Python (WKScriptMessageHandler) ----
  // Sends a {action, payload} blob over the kanban message channel.
  // The Python side handles dispatch — see userContentController:didReceiveScriptMessage:.
  function send(action, payload) {
    try {
      window.webkit.messageHandlers.kanban.postMessage({
        action: action,
        payload: payload || {},
      });
    } catch (err) {
      console.error('[kanban] bridge failure', err);
    }
  }

  // ---- Per-card expansion state ----
  // The kanban refresh cycle replaces #app.innerHTML wholesale on every
  // 5s poll, so we must persist which cards are expanded outside the
  // DOM. Keyed by sessionId. List mode ignores this — its cards always
  // show everything.
  const expandedCards = new Set();

  // Sessions whose add-task input is currently open. Distinct from
  // expandedCards: list mode always shows the add-input; kanban mode
  // only shows it inside an expanded card; but we also let the user
  // explicitly open an input on a collapsed card (e.g. by hitting the
  // empty "+ add task" affordance in list mode — see wireClicks).
  const draftFocus = new Map();  // sessionId -> draft text (in-flight)

  // In-flight task edits. Keyed by taskId so the editing state can be
  // looked up regardless of which card it lives on. The Map stores
  // the draft text the user is typing; if a refresh fires mid-edit
  // we re-enter edit mode for the same row and restore the draft.
  // A null/undefined entry means "not editing" — only present keys
  // are in edit mode.
  //   editingTasks.get(taskId) === undefined  →  view mode
  //   editingTasks.get(taskId) === "..."      →  edit mode, draft text
  const editingTasks = new Map();

  // Escape any HTML in user-supplied strings before inserting via
  // innerHTML. We use textContent where possible but composite rows
  // assemble template strings — this keeps the join cheap and safe.
  function esc(s) {
    if (s == null) return '';
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  // Build the inner HTML for one card. `row` is the slim JSON object
  // sent from Python — see _serialize_row in floating.py for the
  // exact field list.
  function renderCard(row) {
    const bucket = row.bucket || 'dormant';
    const glyph = COL_GLYPH[bucket] || '○';
    const titleSafe = esc(row.title || '(untitled)');
    const folder = esc(row.folder || '');
    const age = esc(row.age || '');
    const unread = row.unread === true;

    // Phase·gist line — phase in muted secondary, gist in primary.
    let phaseGist = '';
    const hasPhase = !!row.phase;
    const hasGist = !!row.gist;
    if (hasPhase || hasGist) {
      let parts = [];
      if (hasPhase) parts.push('<span class="phase">' + esc(row.phase) + '</span>');
      if (hasPhase && hasGist) parts.push('<span class="dotsep">·</span>');
      if (hasGist) parts.push('<span class="gist">' + esc(row.gist) + '</span>');
      phaseGist = '<div class="phase-gist">' + parts.join('') + '</div>';
    }

    // Folder + age metadata line.
    let metaLine = '';
    if (folder || age) {
      metaLine = '<div class="meta">'
        + (folder ? '<span class="folder">' + folder + '</span>' : '')
        + (folder && age ? '<span class="sep">·</span>' : '')
        + (age ? '<span class="age">' + age + '</span>' : '')
        + '</div>';
    }

    // Sub-agent block — running agents listed, then an aggregate
    // footer for any overflow + done/interrupted counts.
    let subBlock = '';
    const subs = Array.isArray(row.subagents) ? row.subagents : [];
    const running = subs.filter(function(s) { return s.state === 'running'; });
    const doneCount = subs.filter(function(s) { return s.state === 'done'; }).length;
    const interruptedCount = subs.filter(function(s) { return s.state === 'interrupted'; }).length;
    const SHOW_MAX = 5;
    const shown = running.slice(0, SHOW_MAX);
    const overflow = running.length - shown.length;

    if (shown.length > 0 || doneCount > 0 || interruptedCount > 0) {
      let lines = shown.map(function(s) {
        const type = esc(s.type || '');
        const desc = esc(s.desc || '');
        return '<div class="agent-line">'
          + '<span class="state-glyph">◐</span>'   // ◐ for running
          + (type ? '<span class="type">' + type + '</span>' : '')
          + (type && desc ? '<span class="sep">·</span>' : '')
          + '<span class="desc">' + desc + '</span>'
          + '</div>';
      });
      // Aggregate footer
      const footerParts = [];
      if (overflow > 0) footerParts.push('+ ' + overflow + ' more working');
      if (doneCount > 0) footerParts.push(doneCount + ' done');
      if (interruptedCount > 0) footerParts.push(interruptedCount + ' interrupted');
      let footer = '';
      if (footerParts.length > 0) {
        // Lead with "+" only if there's no overflow already prefixed.
        const prefix = (overflow > 0) ? '' : '+ ';
        footer = '<div class="agent-footer">' + prefix + footerParts.join(' · ') + '</div>';
      }
      subBlock = '<div class="subagents">' + lines.join('') + footer + '</div>';
    }

    // ---- Tasks block ----
    // Renders between meta and subagents. Hidden entirely when the
    // session has zero tasks AND we're not in list-mode (where we
    // always show the + add affordance even on empty cards) AND the
    // card isn't currently expanded for creation.
    const tasksBlock = renderTasksBlock(row);

    // The clickable unread dot — only rendered when unread is true.
    // We attach the click handler in the post-render wiring step so
    // we can stop event propagation (don't trigger the card's
    // resume-on-click when the user is just marking-as-read).
    const unreadEl = unread
      ? '<span class="unread-dot" data-action="mark-read"></span>'
      : '';

    return ''
      + '<div class="title-row">'
      +   '<span class="dot">' + esc(glyph) + '</span>'
      +   '<span class="title">' + titleSafe + '</span>'
      + '</div>'
      + phaseGist
      + metaLine
      + tasksBlock
      + subBlock
      + unreadEl;
  }

  // Render the per-card tasks block (between meta and subagents).
  // Behavior:
  //   - Dormant cards: fraction-only label, no rows, no expansion.
  //   - List mode: always full list + + add input.
  //   - Kanban mode, collapsed: label + up to 2 preview rows + "+N more".
  //   - Kanban mode, expanded: full list + suggestion divider + add input.
  //   - Cards with zero tasks: block hidden unless list-mode (always show
  //     the + add affordance there so creation is one click away).
  function renderTasksBlock(row) {
    const tasks = Array.isArray(row.tasks) ? row.tasks : [];
    const bucket = row.bucket || 'dormant';
    const isDormant = bucket === 'dormant';
    const isList = document.body.classList.contains('mode-list');
    const sid = row.sessionId || '';
    const expanded = expandedCards.has(sid);

    const total = tasks.length;
    const done = tasks.filter(function(t) { return t.status === 'done'; }).length;
    const openTasks = tasks.filter(function(t) {
      return t.status === 'open' && (t.source !== 'suggested' || t.approved);
    });
    const suggested = tasks.filter(function(t) {
      return t.status === 'open' && t.source === 'suggested' && !t.approved;
    });
    const doneTasks = tasks.filter(function(t) { return t.status === 'done'; });

    // Dormant cards used to collapse to just the fraction — the user
    // overrode that: tasks in dormant sessions stay visible. So dormant
    // now falls through to the normal render path; only the card title
    // dimming (handled in CSS) still distinguishes dormant visually.

    // Empty card — surface a "+ add task" affordance so the user can
    // create the FIRST task without needing an expand target that
    // doesn't exist yet. Click expands the card and reveals the
    // input. List mode falls through to the regular render below
    // which always shows the input row anyway.
    if (total === 0 && !isList && !expanded) {
      return '<div class="tasks empty-tasks">'
        + '<div class="tasks-label add-affordance" data-toggle="1">'
        +   '<span class="chev">+</span>'
        +   '<span>add task</span>'
        + '</div>'
        + '</div>';
    }

    // Decide what subset of tasks to show.
    // List mode + kanban-expanded: show all open + all suggested +
    // recently-done (cap at 2). Kanban collapsed: 2 preview rows.
    const showAll = isList || expanded;
    const PREVIEW_MAX = 2;

    let rowsHtml = '';
    let hiddenCount = 0;
    if (showAll) {
      // Open user tasks
      rowsHtml += openTasks.map(taskRowHtml).join('');
      // Suggested (with divider if there are any)
      if (suggested.length > 0) {
        rowsHtml += '<div class="sugg-divider"><span>suggested by Haiku</span></div>';
        rowsHtml += suggested.map(taskRowHtml).join('');
      }
      // Recently-done (cap at 2 for noise control)
      const recentDone = doneTasks.slice(0, 2);
      rowsHtml += recentDone.map(taskRowHtml).join('');
    } else {
      // Collapsed: prioritize open user tasks first, then suggestions
      // if we have room. Done tasks never appear in preview.
      const previewOpen = openTasks.slice(0, PREVIEW_MAX);
      rowsHtml += previewOpen.map(taskRowHtml).join('');
      // If we have room, show 1 suggestion preview as a teaser.
      const remainingSlots = PREVIEW_MAX - previewOpen.length;
      if (remainingSlots > 0 && suggested.length > 0) {
        rowsHtml += suggested.slice(0, remainingSlots).map(taskRowHtml).join('');
      }
      const previewCount = previewOpen.length
        + Math.min(remainingSlots, suggested.length);
      hiddenCount = (openTasks.length + suggested.length + doneTasks.length)
        - previewCount;
    }

    const moreEl = (hiddenCount > 0)
      ? '<div class="more" data-toggle="1">+ ' + hiddenCount + ' more</div>'
      : '';

    // The + add input or its affordance:
    //   - List mode: always show the input (room to spare).
    //   - Kanban + expanded: show the input.
    //   - Kanban + collapsed + non-empty: show a quiet "+ add task"
    //     link that expands the card on click (auto-focus handled by
    //     rerenderOneCard). Without this, users with one existing
    //     task on a collapsed card see no obvious way to add another.
    //   - Kanban + collapsed + zero tasks: handled above by the
    //     empty-state add-affordance branch — never reaches here.
    let addEl;
    if (isList || expanded) {
      addEl = renderAddTaskInput(sid);
    } else {
      addEl = '<div class="add-task-link" data-toggle="1">+ add task</div>';
    }

    return '<div class="tasks">'
      + '<div class="tasks-label" data-toggle="1">'
      +   '<span class="chev">▸</span>'
      +   '<span>tasks</span>'
      +   '<span class="frac">(' + done + '/' + total + ')</span>'
      + '</div>'
      + rowsHtml
      + moreEl
      + addEl
      + '</div>';
  }

  function taskRowHtml(t) {
    // Defensive: a malformed payload could push a non-object into
    // tasks[]. Render nothing rather than throwing on t.status.
    if (!t || typeof t !== 'object') return '';
    const status = t.status || 'open';
    const isSuggested = t.source === 'suggested' && !t.approved;
    const cls = isSuggested ? 'suggested' : status;  // 'open' | 'done' | 'suggested'
    const glyph =
      isSuggested ? '⋄' :
      status === 'done' ? '●' : '○';
    const tid = esc(t.id || '');

    // Editable iff this is a user-authored task (suggested rows stay
    // read-only until approved). Surface a hint via title attribute
    // + a class the CSS can latch onto for hover feedback.
    const isEditable = !isSuggested;
    const inEdit = isEditable && editingTasks.has(t.id);
    const draftValue = inEdit ? (editingTasks.get(t.id) || '') : null;

    // Text element: a span in view mode, an <input> in edit mode.
    // The input reuses the same data-task-id so handlers can route
    // to the right task regardless of which row was clicked.
    const textEl = inEdit
      ? '<input class="ttext-edit" type="text"'
        + ' data-action="task-edit-input" data-task-id="' + tid + '"'
        + ' value="' + esc(draftValue !== null ? draftValue : (t.content || '')) + '" />'
      : '<span class="ttext' + (isEditable ? ' editable' : '') + '"'
        + (isEditable ? ' data-action="task-edit-begin" data-task-id="' + tid + '"' : '')
        + (isEditable ? ' title="Click to edit"' : '')
        + '>' + esc(t.content || '') + '</span>';

    // Trailing controls: suggestions get ✓/✗; user tasks get ×.
    // Hide them while editing so the input has the full row width.
    const tail = inEdit ? '' : (isSuggested
      ? '<span class="ctrls">'
        + '<span class="ctrl approve" data-action="task-approve" data-task-id="' + tid + '" title="Approve">✓</span>'
        + '<span class="ctrl reject"  data-action="task-reject"  data-task-id="' + tid + '" title="Reject">✗</span>'
        + '</span>'
      : '<span class="tdelete" data-action="task-delete" data-task-id="' + tid + '" title="Delete">×</span>');
    return '<div class="task-row ' + cls + (inEdit ? ' editing' : '') + '" data-task-id="' + tid + '">'
      + '<span class="tglyph" data-action="task-toggle" data-task-id="' + tid + '">' + glyph + '</span>'
      + textEl
      + '</div>';
  }

  function renderAddTaskInput(sid) {
    const draft = esc(draftFocus.get(sid) || '');
    return '<div class="add-task" data-action="add-task-row">'
      + '<span class="plus">+</span>'
      + '<input type="text" data-action="add-task-input" data-session="' + esc(sid) + '"'
      + ' value="' + draft + '"'
      + ' placeholder="Add a task — Enter to save" />'
      + '</div>';
  }

  // Last-rendered payload JSON. Used to dedupe identical refreshes —
  // when Python's 5s tick pushes data that's byte-identical to what
  // we already painted, we skip the full innerHTML rebuild that would
  // otherwise shuffle every card's DOM identity (and visually flicker
  // / shift heights as the browser re-lays everything out).
  let _lastPayloadJson = null;

  // Last-rendered "shape" — the columns and the ordered sessionIds
  // in each. When the new payload's shape matches, we do per-card
  // content updates (cardEl divs stay put, only innerHTML changes)
  // so cards don't visually jump on every age-tick refresh. Shape
  // changes (new/removed session, bucket transition, dormant toggle)
  // fall back to a full DOM rebuild.
  let _lastShape = null;

  function sameShape(a, b) {
    if (!a || !b) return false;
    if (a.length !== b.length) return false;
    for (let i = 0; i < a.length; i++) {
      if (a[i].key !== b[i].key) return false;
      const xs = a[i].sids, ys = b[i].sids;
      if (xs.length !== ys.length) return false;
      for (let j = 0; j < xs.length; j++) if (xs[j] !== ys[j]) return false;
    }
    return true;
  }

  // Escape a value for safe use inside a CSS attribute selector.
  // Session IDs in production are UUIDs (safe), but the in-test
  // values and any future schema change shouldn't trip the selector.
  function cssEscape(s) {
    if (typeof CSS !== 'undefined' && CSS.escape) return CSS.escape(s);
    return String(s).replace(/[^a-zA-Z0-9_-]/g, function(c) {
      return '\\' + c.charCodeAt(0).toString(16) + ' ';
    });
  }

  // Top-level render. Replaces the whole #app subtree on every refresh
  // — cheap because there are O(20) cards total and we're not in a
  // tight animation loop. But idle refreshes still cause visible
  // micro-jumps from the rebuild, so dedupe via JSON-string compare
  // first; in steady state most refreshes are no-ops.
  function renderApp(data) {
    const app = document.getElementById('app');
    if (!app) return;

    // Dedupe identical payloads — skip the whole rebuild so cards
    // don't visually jump on quiet refresh ticks. Comparison cost is
    // O(payload size, ~5KB) which is dwarfed by the innerHTML +
    // wireClicks work it avoids. Stringify failures (circular refs,
    // unlikely from Python) fall through to render as before.
    let payloadJson = null;
    try { payloadJson = JSON.stringify(data); } catch (_) {}
    if (payloadJson !== null && payloadJson === _lastPayloadJson) return;
    _lastPayloadJson = payloadJson;

    // Apply the mode class to the body so all our mode-{kanban,list}
    // CSS rules can target the right layout. Defaults to kanban when
    // the payload omits it (back-compat with older Python builds).
    const mode = (data.mode === 'list') ? 'list' : 'kanban';
    document.body.classList.remove('mode-list', 'mode-kanban');
    document.body.classList.add('mode-' + mode);
    app.classList.toggle('with-dormant', !!data.showDormant);

    // Remember which input had focus + cursor position so we can
    // restore it after the innerHTML replacement. Without this, a 5s
    // background refresh would yank focus out of the user's typing —
    // both the + add-task input and the inline task-edit input.
    // `activeElement` is normally non-null (defaults to <body>) but
    // be defensive — and `.matches` isn't on every element type.
    const activeEl = document.activeElement;
    let focusKind = null;     // 'add' | 'edit' | null
    let focusKey = null;      // sessionId for 'add', taskId for 'edit'
    let focusCaret = 0;
    if (activeEl && typeof activeEl.matches === 'function') {
      if (activeEl.matches('input[data-action="add-task-input"]')) {
        focusKind = 'add';
        focusKey = activeEl.dataset.session || null;
        focusCaret = activeEl.selectionStart || 0;
      } else if (activeEl.matches('input[data-action="task-edit-input"]')) {
        focusKind = 'edit';
        focusKey = activeEl.dataset.taskId || null;
        focusCaret = activeEl.selectionStart || 0;
      }
    }

    // Populate row cache so rerenderOneCard() (used by expand/collapse)
    // can rebuild a single card without a fresh Python push.
    lastRows.clear();

    const buckets = data.buckets || {};

    // Compute the new card layout (which sessions in which columns).
    // If this matches what's currently in the DOM, we can do a per-
    // card content update — cards stay in place, only their inner
    // HTML changes — which preserves hover state and avoids the
    // visible "jump" that happens when the whole #app subtree is
    // replaced and the browser re-lays everything out.
    const newShape = [];  // array of {key, sids: [sessionId, ...]}
    COL_KEYS.forEach(function(key) {
      if (key === 'dormant' && !data.showDormant) return;
      const rows = buckets[key] || [];
      newShape.push({ key: key, sids: rows.map(function(r){ return r.sessionId || ''; }) });
      rows.forEach(function(r) { if (r.sessionId) lastRows.set(r.sessionId, r); });
    });

    const shapeSame = sameShape(newShape, _lastShape) && app.children.length > 0;

    if (shapeSame) {
      // ---- Per-card update path ----
      // Same sessions in the same columns. Walk the existing cardEls
      // in place and replace ONLY their innerHTML. CardEl divs (and
      // their position in the column) are not touched, so cards do
      // not jump. Listeners on cardEl (resume click) persist because
      // wireCardClicks gates that on a dataset flag.
      newShape.forEach(function(colSpec) {
        const colEl = app.querySelector('.col[data-key="' + colSpec.key + '"]');
        if (!colEl) return;
        // Update header count
        const countEl = colEl.querySelector('.col-header .count');
        if (countEl) countEl.textContent = String(colSpec.sids.length);
        // Per-card content update
        const rows = buckets[colSpec.key] || [];
        rows.forEach(function(r) {
          const cardEl = colEl.querySelector(
            '.card[data-session="' + cssEscape(r.sessionId) + '"]'
          );
          if (!cardEl) return;
          // Reflect possibly-changed bucket / unread / expanded class
          cardEl.className = 'card ' + (r.bucket || 'dormant')
            + (r.unread ? ' is-unread' : '')
            + (expandedCards.has(r.sessionId) ? ' expanded' : '');
          cardEl.dataset.cwd = r.cwd || '';
          cardEl.innerHTML = renderCard(r);
          // Re-wire the (new) inner children. cardEl-level click
          // listener was attached on initial wire and survives via
          // the data-body-wired flag.
          wireCardClicks(cardEl);
        });
      });
    } else {
      // ---- Full rebuild path ----
      // Shape changed (card moved buckets, new session, gone session,
      // dormant toggled). Repaint the whole #app subtree.
      const cols = [];
      COL_KEYS.forEach(function(key) {
        if (key === 'dormant' && !data.showDormant) return;
        const rows = buckets[key] || [];
        const count = rows.length;
        const label = COL_LABELS[key] || key;
        const cards = rows.length
          ? rows.map(function(r) {
              const isExpanded = expandedCards.has(r.sessionId);
              return '<div class="card ' + esc(r.bucket)
                + (r.unread ? ' is-unread' : '')
                + (isExpanded ? ' expanded' : '')
                + '" data-session="' + esc(r.sessionId)
                + '" data-cwd="' + esc(r.cwd || '')
                + '">' + renderCard(r) + '</div>';
            }).join('')
          : '<div class="empty">—</div>';
        cols.push(''
          + '<div class="col" data-key="' + esc(key) + '">'
          +   '<div class="col-header">'
          +     '<span class="label">' + esc(label) + '</span>'
          +     '<span class="count">' + count + '</span>'
          +   '</div>'
          +   '<div class="col-body">' + cards + '</div>'
          + '</div>'
        );
      });
      app.innerHTML = cols.join('');
      // Wire click handlers AFTER the DOM is replaced.
      wireClicks();
    }
    _lastShape = newShape;

    // Garbage-collect stale per-card state: any session that's no
    // longer in the current payload (dormant promoted out of view,
    // session deleted on disk, etc.) shouldn't keep accumulating
    // expansion / draft entries over the badge's lifetime.
    expandedCards.forEach(function(sid) {
      if (!lastRows.has(sid)) expandedCards.delete(sid);
    });
    draftFocus.forEach(function(_v, sid) {
      if (!lastRows.has(sid)) draftFocus.delete(sid);
    });

    // Restore focus + caret if the user was typing into either of
    // the two input kinds (+ add-task or inline task edit) when the
    // refresh fired. Find by the input's keying attribute.
    if (focusKind && focusKey) {
      const selector = focusKind === 'add'
        ? 'input[data-action="add-task-input"][data-session="' + cssEscape(focusKey) + '"]'
        : 'input[data-action="task-edit-input"][data-task-id="' + cssEscape(focusKey) + '"]';
      const inp = document.querySelector(selector);
      if (inp) {
        inp.focus();
        try { inp.setSelectionRange(focusCaret, focusCaret); }
        catch (e) { /* selection unavailable on some input types — fine */ }
      }
    }
  }

  // Top-level wiring after a full renderApp() — walks every card and
  // delegates to wireCardClicks for each. Used only on the full
  // refresh path; partial rerenders (expand/collapse) call
  // wireCardClicks on a single element to avoid attaching duplicate
  // listeners to every OTHER card on every interaction.
  function wireClicks() {
    document.querySelectorAll('.card').forEach(wireCardClicks);
  }

  // Wire every interactive handler within a single card's subtree.
  // Safe to call on a freshly-rendered card AND on a partially-rerendered
  // card (where cardEl itself persists across the innerHTML swap): the
  // card-body resume listener is gated by a dataset flag so it's
  // attached at most once per cardEl lifetime, and the inner per-element
  // listeners are always against freshly-replaced children so there's
  // no duplication risk.
  function wireCardClicks(cardEl) {
    if (!cardEl) return;

    // Card body → resume session in its host. ONLY attach if not
    // already wired — a partial rerender (expand/collapse) keeps
    // cardEl alive and re-running this would stack listeners,
    // causing every resume click to fire 2+ times. The dataset flag
    // is cleared automatically when cardEl is replaced wholesale
    // by the next full renderApp() tick.
    if (!cardEl.dataset.bodyWired) {
      cardEl.addEventListener('click', function(ev) {
        const target = ev.target;
        if (!target) return;
        if (target.closest('.tasks')) return;
        if (target.closest('[data-action]')) return;
        if (target.closest('input,textarea')) return;
        send('resume', {
          sessionId: cardEl.dataset.session || '',
          cwd: cardEl.dataset.cwd || '',
        });
      });
      cardEl.dataset.bodyWired = '1';
    }

    // Unread dot → mark-read.
    cardEl.querySelectorAll('[data-action="mark-read"]').forEach(function(el) {
      el.addEventListener('click', function(ev) {
        ev.stopPropagation();
        send('markRead', { sessionId: cardEl.dataset.session || '' });
      });
    });

    // Tasks-label or "+N more" → toggle card expansion. Kanban only —
    // list mode always shows the full list.
    cardEl.querySelectorAll('[data-toggle="1"]').forEach(function(el) {
      el.addEventListener('click', function(ev) {
        ev.stopPropagation();
        if (document.body.classList.contains('mode-list')) return;
        const sid = cardEl.dataset.session || '';
        if (!sid) return;
        if (expandedCards.has(sid)) expandedCards.delete(sid);
        else expandedCards.add(sid);
        rerenderOneCard(cardEl);
      });
    });

    // Task glyph → toggle open/done.
    cardEl.querySelectorAll('[data-action="task-toggle"]').forEach(function(el) {
      el.addEventListener('click', function(ev) {
        ev.stopPropagation();
        const tid = el.dataset.taskId;
        if (!tid) return;
        send('taskToggle', {
          sessionId: cardEl.dataset.session || '',
          taskId: tid,
        });
      });
    });

    // Click task text → enter edit mode. The current row is swapped
    // to render an <input> via rerenderOneCard; the input gets focus
    // + caret-at-end on the new render. Only user-authored rows
    // expose this affordance (suggestions get the ✓/✗ controls).
    cardEl.querySelectorAll('[data-action="task-edit-begin"]').forEach(function(el) {
      el.addEventListener('click', function(ev) {
        ev.stopPropagation();
        const tid = el.dataset.taskId;
        if (!tid) return;
        // Seed the editing-state Map with the current content so the
        // input renders pre-filled. The Map's mere presence signals
        // edit mode to taskRowHtml.
        const row = lastRows.get(cardEl.dataset.session || '');
        const t = row && (row.tasks || []).find(function(x) { return x.id === tid; });
        editingTasks.set(tid, (t && t.content) || '');
        rerenderOneCard(cardEl);
        // Move focus to the newly-rendered input.
        const inp = cardEl.querySelector(
          'input[data-action="task-edit-input"][data-task-id="' + tid + '"]'
        );
        if (inp) {
          inp.focus();
          const len = (inp.value || '').length;
          try { inp.setSelectionRange(len, len); } catch (e) { /* ok */ }
        }
      });
    });

    // Inline task-edit input — Enter saves, Esc cancels, blur saves
    // when changed / cancels when unchanged. Mirrors the behavior of
    // the + add-task input but routes to taskEdit instead of
    // taskCreate.
    cardEl.querySelectorAll('input[data-action="task-edit-input"]').forEach(function(inp) {
      const tid = inp.dataset.taskId;
      if (!tid) return;
      const row = lastRows.get(cardEl.dataset.session || '');
      const original = (row && (row.tasks || []).find(function(x) { return x.id === tid; }) || {}).content || '';

      const commit = function() {
        const text = (inp.value || '').trim();
        if (!text) {
          // Empty content — refuse the edit and revert to view. We
          // could treat empty-on-Enter as a delete, but that's a
          // bigger destructive action and deserves the explicit ×.
          editingTasks.delete(tid);
          rerenderOneCard(cardEl);
          return;
        }
        if (text === original) {
          // Unchanged — just exit edit mode, no Python round-trip.
          editingTasks.delete(tid);
          rerenderOneCard(cardEl);
          return;
        }
        send('taskEdit', {
          sessionId: cardEl.dataset.session || '',
          taskId: tid,
          content: text,
        });
        // Clear local edit state; the refresh from Python will
        // render the new content. Don't rerender locally — that
        // would briefly flash the old content before the refresh
        // lands and override.
        editingTasks.delete(tid);
      };

      // Track draft so a refresh mid-edit can restore the in-flight
      // value rather than dropping the user's typing.
      inp.addEventListener('input', function() {
        editingTasks.set(tid, inp.value);
      });
      inp.addEventListener('keydown', function(ev) {
        ev.stopPropagation();
        if (ev.key === 'Enter') {
          ev.preventDefault();
          commit();
        } else if (ev.key === 'Escape') {
          ev.preventDefault();
          editingTasks.delete(tid);
          rerenderOneCard(cardEl);
        }
      });
      inp.addEventListener('blur', commit);
      // Don't let the inner click bubble up to the card-resume handler.
      inp.addEventListener('click', function(ev) { ev.stopPropagation(); });
    });

    // Hover × → delete user-authored task.
    cardEl.querySelectorAll('[data-action="task-delete"]').forEach(function(el) {
      el.addEventListener('click', function(ev) {
        ev.stopPropagation();
        const tid = el.dataset.taskId;
        if (!tid) return;
        send('taskDelete', {
          sessionId: cardEl.dataset.session || '',
          taskId: tid,
        });
      });
    });

    // ✓ approve suggestion.
    cardEl.querySelectorAll('[data-action="task-approve"]').forEach(function(el) {
      el.addEventListener('click', function(ev) {
        ev.stopPropagation();
        const tid = el.dataset.taskId;
        if (!tid) return;
        send('taskApprove', {
          sessionId: cardEl.dataset.session || '',
          taskId: tid,
        });
      });
    });

    // ✗ reject suggestion.
    cardEl.querySelectorAll('[data-action="task-reject"]').forEach(function(el) {
      el.addEventListener('click', function(ev) {
        ev.stopPropagation();
        const tid = el.dataset.taskId;
        if (!tid) return;
        send('taskReject', {
          sessionId: cardEl.dataset.session || '',
          taskId: tid,
        });
      });
    });

    // + add task input — Enter saves, Esc cancels, blur clears draft.
    cardEl.querySelectorAll('[data-action="add-task-input"]').forEach(function(inp) {
      const sid = inp.dataset.session || '';
      if (draftFocus.has(sid) && inp.value === '') {
        inp.value = draftFocus.get(sid) || '';
      }
      inp.addEventListener('input', function() {
        draftFocus.set(sid, inp.value);
      });
      inp.addEventListener('keydown', function(ev) {
        ev.stopPropagation();
        if (ev.key === 'Enter') {
          ev.preventDefault();
          const text = (inp.value || '').trim();
          if (!text) return;
          send('taskCreate', { sessionId: sid, content: text });
          draftFocus.delete(sid);
          inp.value = '';
          inp.focus();
        } else if (ev.key === 'Escape') {
          ev.preventDefault();
          draftFocus.delete(sid);
          inp.value = '';
          inp.blur();
        }
      });
      inp.addEventListener('click', function(ev) { ev.stopPropagation(); });
    });
  }

  // Re-render a single card's innerHTML from the last-known payload.
  // Used by the expand/collapse toggle so we don't trigger a full
  // popover repaint just to flip a chevron. The next refresh tick
  // will rebuild from fresh data anyway.
  function rerenderOneCard(cardEl) {
    if (!cardEl) return;
    const sid = cardEl.dataset.session || '';
    const row = lastRows.get(sid);
    if (!row) return;
    // Reflect expansion in the class so .expanded CSS rules apply.
    const wasExpanded = expandedCards.has(sid);
    if (wasExpanded) cardEl.classList.add('expanded');
    else cardEl.classList.remove('expanded');
    cardEl.innerHTML = renderCard(row);
    // Scope handler re-wiring to THIS card — calling the global
    // wireClicks() would attach extra listeners to every other card
    // in the popover on every expand/collapse, which compounds across
    // interactions until the next 5s refresh resets the DOM. Per-card
    // scoping keeps the listener count tidy.
    wireCardClicks(cardEl);
    // If the user just expanded the card, auto-focus the + add input
    // so the next keystroke goes into it without an extra click. We
    // ALWAYS focus (not only on empty input) — a stale draftFocus
    // entry can pre-fill the value, and the user still expects
    // typing to extend that draft, not require a manual click into
    // the input. Park caret at end so the prefill isn't selected
    // and overwritten by the first keystroke.
    if (wasExpanded) {
      const input = cardEl.querySelector('input[data-action="add-task-input"]');
      if (input) {
        input.focus();
        const len = (input.value || '').length;
        try { input.setSelectionRange(len, len); } catch (e) { /* ok */ }
      }
    }
  }

  // Row cache keyed by sessionId — lets rerenderOneCard rebuild a
  // single card without a fresh Python payload. Populated by renderApp
  // on every full refresh.
  const lastRows = new Map();

  // Expose for Python to call via evaluateJavaScript.
  window.renderApp = renderApp;
  // Empty initial state so the body isn't blank before the first
  // refresh comes through.
  renderApp({ buckets: {}, showDormant: false });

  // Tell Python we're mounted and ready for renderApp() calls.
  // PopoverVC buffers any refresh() that arrives before this fires
  // and flushes it from the 'ready' handler.
  if (document.readyState === 'complete' || document.readyState === 'interactive') {
    send('ready');
  } else {
    document.addEventListener('DOMContentLoaded', function() { send('ready'); }, { once: true });
  }
})();
</script>
</body>
</html>
